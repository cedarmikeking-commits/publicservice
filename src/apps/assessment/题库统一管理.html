<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>统一试题管理 · V19.2（交互答题预览）</title>
    <style>
      :root {
        font:
          14px -apple-system,
          BlinkMacSystemFont,
          "PingFang SC",
          "Microsoft YaHei",
          sans-serif;
        color: #223946;
        background: #f4f8f9;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        background: #087d72;
        border: 0;
        border-radius: 8px;
        padding: 9px 13px;
        color: #fff;
        cursor: pointer;
      }
      button.secondary {
        background: #e7f2f0;
        color: #126e66;
      }
      button.warn {
        background: #fff0e9;
        color: #a94330;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      input,
      select,
      textarea {
        padding: 10px;
        border: 1px solid #cedde0;
        border-radius: 8px;
        background: white;
        width: 100%;
        min-width: 0;
      }
      textarea {
        min-height: 90px;
      }
      header {
        background: #153644;
        color: white;
        padding: 17px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      header h1 {
        margin: 0;
        font-size: 20px;
      }
      .container {
        max-width: 1500px;
        margin: auto;
        padding: 20px;
      }
      .panel {
        background: white;
        border: 1px solid #e0e9e9;
        border-radius: 12px;
        padding: 18px;
        margin-bottom: 16px;
      }
      .tools,
      .row {
        display: flex;
        align-items: center;
        gap: 9px;
        flex-wrap: wrap;
      }
      .tools > * {
        flex: 1 1 160px;
      }
      .tools button {
        flex: 0 0 auto;
      }
      .tabs button {
        margin-right: 8px;
      }
      .muted {
        color: #667e88;
      }
      .stats {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .stats span {
        background: #edf6f3;
        border-radius: 9px;
        padding: 10px 15px;
      }
      .scroll {
        overflow: auto;
        max-width: 100%;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        min-width: 1080px;
      }
      td,
      th {
        padding: 10px;
        border-bottom: 1px solid #e8eff0;
        text-align: left;
        vertical-align: top;
      }
      th {
        background: #f4f8f8;
        position: sticky;
        top: 0;
      }
      .pill {
        border-radius: 15px;
        background: #e7f2f0;
        padding: 3px 9px;
        white-space: nowrap;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 13px;
      }
      .wide {
        grid-column: 1/-1;
      }
      label {
        display: grid;
        gap: 6px;
        font-weight: 600;
        color: #445f6b;
      }
      .modal {
        position: fixed;
        inset: 0;
        background: #132e3caa;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 15px;
      }
      .modal section {
        width: min(950px, 100%);
        max-height: 95vh;
        overflow: auto;
        background: #fff;
        border-radius: 14px;
        padding: 23px;
      }
      .modal h2 {
        margin-top: 0;
      }
      .hint {
        background: #eef8f5;
        padding: 12px;
        border-radius: 9px;
        color: #29655d;
      }
      .nowrap {
        white-space: nowrap;
      }
      @media (max-width: 700px) {
        .grid {
          grid-template-columns: 1fr;
        }
        .wide {
          grid-column: auto;
        }
        .container {
          padding: 10px;
        }
        .modal section {
          padding: 12px;
        }
      }
      .q-rubric-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      .q-rubric-table th,
      .q-rubric-table td {
        padding: 9px 10px;
        border-bottom: 1px solid #e3ebed;
        text-align: left;
        vertical-align: top;
      }
      .q-rubric-table th {
        background: #f3f8f8;
      }
      .q-answer-note {
        font-size: 12px;
        color: #627987;
        line-height: 1.7;
      }
    </style>
    <link rel="stylesheet" href="wbzy-ui-fixes-v162.css" />
    <style>
      body.is-embedded {
        background: #fff;
      }
      body.is-embedded > header {
        display: none !important;
      }
      body.is-embedded > .container {
        max-width: none;

        border-color: #e7eef1;

        margin-bottom: 12px;

        body.is-embedded > .container {

      /* V19.2 统一交互式答题预览 */
      .q-detail-modal .q-detail-panel {
        width: min(920px, 94vw);
        max-width: 94vw;
        max-height: 88vh;
        overflow-y: auto;
        box-sizing: border-box;
      }
      .q-detail-heading {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        border-bottom: 1px solid #e2ebef;
        padding-bottom: 14px;
        margin-bottom: 16px;
      }
      .q-detail-heading h2 {
        margin: 0 0 6px;
      }
      .q-detail-heading p {
        margin: 0;
        color: #64808a;
        font-size: 13px;
      }
      .q-detail-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 18px;
      }
      .q-detail-meta span {
        border: 1px solid #dce9eb;
        border-radius: 7px;
        background: #f3f9f9;
        padding: 6px 9px;
        color: #28505a;
        font-size: 12px;
      }
      .q-detail-section {
        padding: 14px 0;
        border-top: 1px solid #edf1f2;
      }
      .q-detail-section h3 {
        font-size: 14px;
        margin: 0 0 10px;
        color: #315467;
      }
      .q-detail-value {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        line-height: 1.9;
        color: #193a46;
      }
      .q-detail-list {
        margin: 0;
        padding-left: 24px;
        line-height: 1.9;
        overflow-wrap: anywhere;
      }
      .q-detail-list li {
        padding: 3px 0;
      }
      .q-detail-json {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: #f5f9fa;
        padding: 12px;
        border-radius: 8px;
        font-size: 12px;
      }
      .q-detail-footer {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 18px;
        border-top: 1px solid #edf1f2;
        padding-top: 16px;
      }
    </style>
    <style>

        top: 0;
        z-index: 80;
        margin: 0 0 12px;
        background: #eef8f7;
        border: 1px solid #b6e2da;

      <style>
/* V18.5: visible, contextual loading feedback inside the question list */
.wbzy-list-loading {

    <style>
      /* V18.7 试题列表：稳定列宽、避免编码断行、整齐的操作区 */
      #list.scroll {
        width: 100%;
        overflow-x: auto;
        overflow-y: visible;
      }
      #list .q-maint-table {
        width: 100%;
        min-width: 1160px;
        table-layout: fixed;
        border-collapse: separate;
        border-spacing: 0;
      }
      #list .q-maint-table th {
        font-size: 13px;

        background: #f2f7f8;

      }
      #list .q-maint-table td {
        padding: 16px 12px;
        vertical-align: top;

        border-bottom: 1px solid #e7eeee;

      #list .q-maint-table tbody tr:hover {
        background: #f8fbfb;
      }
      #list .q-code {
        font-size: 14px;

      #list .q-sub {

      #list .q-actions {

      #list .q-actions button {

      }
      #list .q-actions .q-review {

      }
      @media (max-width: 1200px) {

        }
      }

    <style>
      .q-choices {
        list-style: none;
        padding-left: 0 !important;
        display: grid;
        gap: 8px;
      }
      .q-choices li {

        border: 1px solid #e3ebed;

      }
      .q-choices li.q-correct-choice {

      /* V19.1 与前端答题交互相似的只读题库预览（作答仅暂存本弹窗） */
      .qp-shell {

      .qp-banner {

      .qp-stem {

  <body>
    <header>
      <div>
        <h1>统一试题管理</h1>
        <small>指标体系 → 考评点 → 题型 → 命题 → 审定 → 发布 → 版本追溯</small>
      </div>
      <a style="color: #cce7e5" href="admin.html#bank">返回运营后台</a>
    </header>
    <main class="container">
      <div id="wbzy-operation-progress" role="status" aria-live="polite">
        <div class="op-header"><span id="wbzy-op-label">正在加载试题</span><span id="wbzy-op-pct">0%</span></div>
        <div class="op-track"><div class="op-bar" id="wbzy-op-bar"></div></div>
        <div class="op-note" id="wbzy-op-note">准备试题索引…</div>
      </div>
      <div class="panel">
        <div class="stats" id="stats"></div>
        <p class="muted">
          统一管理两套指标体系。V19.5 已校验17种题型示例接入（搜索
          WBZY-DEMO；各题型显示实际数量）；原通用试题首次加载为“训练样例”，不会自动变成已审定试题。更改仅保存到当前浏览器；导出发布快照后可替换部署文件。
        </p>
      </div>
      <div class="panel">
        <div class="tools">
          <select id="framework">
            <option value="all">全部指标体系</option>
            <option value="general">通用数智能力</option>
            <option value="teacher">教师素智素养</option></select
          ><select id="status">
            <option value="all">全部状态</option>
            <option>训练样例</option>
            <option>草稿</option>
            <option>待审定</option>
            <option>退回修订</option>
            <option>已通过</option>
            <option>已发布</option>
            <option>已停用</option></select
          ><select id="type">
            <option value="all">全部题型</option></select
          ><input id="keyword" placeholder="检索题号、题干、考评点、指标" /><button onclick="newQ()">＋ 新增试题</button
          ><button class="secondary" onclick="downloadSnapshot()">导出发布 JS</button
          ><button class="secondary" onclick="downloadBackup()">导出完整备份</button>
        </div>
      </div>
      <div
        id="wbzy-example-warning"
        hidden
        style="
          margin: 10px 0;
          padding: 12px 16px;
          background: #fff4e3;
          color: #8a4e04;
          border: 1px solid #e8c37b;
          border-radius: 9px;
        "
      ></div>
      <div class="panel">
        <div class="row" style="justify-content: space-between">
          <h3>试题列表</h3>
          <span id="summary" class="muted"></span>
        </div>
        <div
          id="wbzy-list-loading"
          class="wbzy-list-loading active"
          role="status"
          aria-live="polite"
          aria-label="试题加载进度"
        >
          <div class="wbzy-list-loading-head">
            <span id="wbzy-list-loading-label">正在准备试题列表…</span><strong id="wbzy-list-loading-pct">0%</strong>
          </div>
          <div
            class="wbzy-list-loading-track"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
            id="wbzy-list-loading-track"
          >
            <div id="wbzy-list-loading-bar"></div>
          </div>
          <p id="wbzy-list-loading-note">正在载入题库数据，请稍候…</p>
        </div>
        <div class="scroll" id="list"></div>
        <div class="row" style="justify-content: center; margin-top: 12px">
          <button class="secondary" onclick="pageTurn(-1)">上一页</button><span id="pageInfo"></span
          ><button class="secondary" onclick="pageTurn(1)">下一页</button>
        </div>
      </div>
      <div class="panel">
        <h3>操作审计</h3>
        <div id="log" class="muted"></div>
      </div>
    </main>
    <div id="modalHost"></div>
    <script src="wbzy-interactive-engine.js"></script>

        }
        function qpCollect() {
          if (!qpCurrent) return;
          const t = qpCurrent.type,
            host = document.getElementById("qp-workspace");
          if (!host) return;
          if (["multiple", "multi"].includes(t))
            qpAnswer = [...host.querySelectorAll('input[name="qp_answer"]:checked')].map((x) => +x.value);
          else if (["single", "choice", "judge"].includes(t))
            qpAnswer = host.querySelector('input[name="qp_answer"]:checked')?.value ?? null;
          else if (["ordering", "order"].includes(t))
            qpAnswer = [...host.querySelectorAll("[data-qp-order]")].map((x) => (x.value === "" ? null : +x.value));
          else if (t === "matching" && host.querySelector("[data-qp-match]"))
            qpAnswer = [...host.querySelectorAll("[data-qp-match]")].map((x) => (x.value === "" ? null : +x.value));
          else qpAnswer = host.querySelector("#qp-text")?.value ?? "";
        }
        let wiInstance = null;
        function qpReset() {
          if (wiInstance) {
            wiInstance = wiInstance.reset();
            document.getElementById("qp-feedback").hidden = true;
            document.getElementById("qp-submit").disabled = false;
            return;
          }
          if (!qpCurrent) return;
          qpAnswer = null;
          qpSubmitted = false;
          document.getElementById("qp-workspace").innerHTML = qpBody(qpCurrent);
          document.getElementById("qp-feedback").hidden = true;
          document.getElementById("qp-submit").disabled = false;
        }
        function qpSubmit() {
          if (!qpCurrent) return;
          if (wiInstance) {
            const result = wiInstance.submit(),
              fb = document.getElementById("qp-feedback");
            fb.hidden = false;
            fb.innerHTML =
              "<b>互动操作反馈</b><p>" +
              esc(result.title) +
              "：" +
              esc(result.details) +
              "</p><p>后台预览不保存正式成绩。</p>";
            document.getElementById("qp-submit").disabled = true;
            return;
          }
          qpCollect();
          const q = qpCurrent,
            options = qpChoices(q),
            raw = q.answer ?? q.correctAnswer;
          const box = document.getElementById("qp-feedback");
          box.hidden = false;
          qpSubmitted = true;
          let result = "";
          const typed = ["single", "choice", "multiple", "multi"].includes(q.type);
          if (typed && options.length) {
            const expected = Array.isArray(raw) ? raw : [raw];
            const received = Array.isArray(qpAnswer) ? qpAnswer : [qpAnswer];
            const valid = expected.every((i) => Number.isInteger(i) && i >= 0 && i < options.length);
            const correct =
              valid &&
              received.length === expected.length &&
              expected.every((i) => received.some((j) => Number(j) === i));
            result =
              "<p><b>答题反馈：</b>" +
              (received.every((x) => x !== null && x !== undefined)
                ? correct
                  ? "与参考答案一致"
                  : "与参考答案不一致"
                : "尚未选择答案") +
              "</p>";
            result +=
              "<p><b>参考答案：</b>" +
              (valid
                ? expected.map((i) => "ABCDEFGHIJKLMNOPQRSTUVWXYZ"[i] + "．" + esc(options[i])).join("；")
                : "未提供有效客观答案") +
              "</p>";
          } else if (["ordering", "order"].includes(q.type) && Array.isArray(raw) && options.length) {
            const valid = raw.every((i) => Number.isInteger(i) && i >= 0 && i < options.length);
            result =
              "<p><b>参考顺序：</b>" +
              (valid ? raw.map((i, j) => j + 1 + "．" + esc(options[i])).join(" → ") : "请核验原始排序数据") +
              "</p>";
          } else result = "<p>本题不进行自动计分，请对照参考要求与评分量规审核作答。</p>";
          const ref = q.referenceAnswer ?? q.explain ?? q.explanation ?? q.analysis;
          if (ref) result += "<p><b>参考要求：</b>" + esc(typeof ref === "string" ? ref : JSON.stringify(ref)) + "</p>";
          let rubric = q.rubric ?? q.scoringRubric ?? q.scoringCriteria;
          if (Array.isArray(rubric) && rubric.length)
            result +=
              '<div class="q-detail-section"><h3>评分量规（仅用于人工核验）</h3><table class="q-rubric-table"><thead><tr><th>维度</th><th>分值</th><th>要求</th></tr></thead><tbody>' +
              rubric
                .map(
                  (v) =>
                    "<tr><td>" +
                    esc(v.dimension || v.name || "—") +
                    "</td><td>" +
                    esc(v.max ?? v.maxScore ?? v.score ?? "—") +
                    "</td><td>" +
                    esc(v.rule || v.description || "—") +
                    "</td></tr>",
                )
                .join("") +
              "</tbody></table></div>";
          box.innerHTML =
            "<h3>提交结果 · 预览模式</h3>" +
            result +
            '<p class="q-answer-note">本次作答仅用于后台预览，不保存成绩，不改变试题审定状态。</p>';
          document.getElementById("qp-submit").disabled = true;
          box.scrollIntoView({ block: "nearest", behavior: "smooth" });
        }
        function viewQuestion(id) {
          const q = original(id);
          if (!q) {
            alert("未找到该试题：" + id);
            return;
          }
          qpCurrent = q;
          qpAnswer = null;
          qpSubmitted = false;
          wiInstance = null;
          const typeName = TYPES.find((t) => t[0] === q.type)?.[1] || q.typeName || q.type || "未设置";
          $("modalHost").innerHTML =
            `<div class="modal q-detail-modal" onclick="if(event.target===this)closeModal()"><section class="q-detail-panel" role="dialog" aria-modal="true" aria-label="试题答题预览"><div class="q-detail-heading"><div><h2>试题答题预览 · ${esc(q.id)} · V19.6</h2><p>选择答案或完成任务后提交，查看参考反馈；不会保存正式成绩</p></div><button class="secondary" onclick="closeModal()">关闭 ✕</button></div><div class="q-detail-meta"><span>${esc(q.framework === "general" ? "通用数智能力" : "教师素智素养")}</span><span>考评点：${esc(q.assessmentPointCode || q.pointCode || "—")}</span><span>题型：${esc(typeName)}</span><span>等级：${esc(q.level || q.suggestedLevel || "未设置")}</span></div><div class="qp-shell"><div class="qp-banner">V19.6 · 共用交互引擎　｜　选择或输入作答　→　提交　→　查看反馈</div><h3 class="qp-stem">${esc(q.stem || q.question || "（缺少题干）")}</h3>${q.scenario ? '<p class="q-detail-value">' + esc(q.scenario) + "</p>" : ""}<div id="qp-workspace">${qpBody(q)}</div><div id="qp-feedback" class="qp-feedback" hidden></div><div class="qp-actions"><button class="secondary" onclick="qpReset()">重新作答</button><button id="qp-submit" onclick="qpSubmit()">提交并查看反馈</button><button class="secondary" onclick="closeModal();edit('${esc(q.id)}')">编辑试题</button></div></div></section></div>`;
          if (window.WBZY_INTERACTIVE?.types.includes(q.type)) {
            wiInstance = window.WBZY_INTERACTIVE.mount(document.getElementById("wbzy-interactive-host"), q);
          }
        }
        function closeModal() {
          $("modalHost").innerHTML = "";
        }
        function downloadText(name, txt) {
          let u = URL.createObjectURL(new Blob([txt], { type: "text/javascript;charset=utf-8" })),
            a = document.createElement("a");
          a.href = u;
          a.download = name;
          a.click();
          setTimeout(() => URL.revokeObjectURL(u), 500);
        }
        function downloadSnapshot() {
          downloadText("unified-published-bank.js", S.exportJS());
        }
        function downloadBackup() {
          downloadText(
            "统一试题库_完整备份.json",
            JSON.stringify({ questions: S.get(), audits: S.audit(), exported: new Date().toISOString() }, null, 2),
          );
        }
        TYPES.forEach((x) => {
          $("type").insertAdjacentHTML("beforeend", `<option value="${x[0]}">${x[1]}</option>`);
        });
        ["framework", "status", "type", "keyword"].forEach((id) =>
          $(id).addEventListener(id === "keyword" ? "input" : "change", () => {
            page = 1;
            scheduleBankRender("filter");
          }),
        );
        window.addEventListener("error", (e) => {
          try {
            opFailed(e.message || "脚本错误");
            wbzyNotify(0, "", false, e.message || "脚本错误");
          } catch (_) {}
        });
        const wbzyParams = new URLSearchParams(location.search),
          wbzyEmbedded = wbzyParams.get("embedded") === "1";
        if (wbzyEmbedded) document.body.classList.add("is-embedded");
        if (wbzyParams.get("mode") === "review") $("status").value = "待审定";
        function wbzyNotify(percent, stage, ready, error) {
          if (wbzyEmbedded && parent !== window)
            parent.postMessage({ kind: "wbzy-bank-progress", percent, stage, ready: !!ready, error: error || "" }, "*");
        }
        function wbzyInit() {
          if (!wbzyEmbedded) {
            render();
            return;
          }
          opProgress(60, "正在整理试题记录", "正在合并候选试题与本地修改…");
          wbzyNotify(60, "正在整理试题记录…");
          // 先让浏览器绘制进度条，再执行可能耗时的离线题库读取。
          requestAnimationFrame(() => requestAnimationFrame(beginIndex));
          function beginIndex() {
            let all = [];
            try {
              all = S.get();
            } catch (e) {
              opFailed(String(e.message || e));
              wbzyNotify(0, "", false, String(e.message || e));
              return;
            }
            opProgress(65, "正在建立题库索引", "已读取 " + all.length.toLocaleString() + " 道候选试题，开始逐批核验…");
            const total = all.length,
              step = 500;
            let index = 0;
            function batch() {
              try {
                let until = Math.min(total, index + step);
                // 分批检查记录索引信息及检索字段，进度以真实处理数量计算。
                for (; index < until; index++) {
                  const q = all[index];
                  if (!q || !q.id) {
                    throw Error("第" + (index + 1) + "条题目缺少编号");
                  }
                }
                const pct = total ? Math.round(65 + (index / total) * 33) : 98;
                opProgress(pct, "正在加载试题库", `已核验 ${index.toLocaleString()} / ${total.toLocaleString()} 道`);
                wbzyNotify(pct, `正在核验试题索引：${index.toLocaleString()} / ${total.toLocaleString()} 道`);
                if (index < total) {
                  requestAnimationFrame(batch);
                  return;
                }
                render();
                opProgress(100, "试题加载完成", `已加载 ${total.toLocaleString()} 道试题`);
                requestAnimationFrame(opDone);
                wbzyNotify(100, `已加载 ${total.toLocaleString()} 道试题，每页展示15道`, true);
              } catch (e) {
                opFailed(String(e.message || e));
                wbzyNotify(0, "", false, String(e.message || e));
              }
            }
            requestAnimationFrame(batch);
          } // beginIndex
        }
        // HTML 内联 onclick 在 window 上解析；这些处理函数定义于 wbzyStartBank 的词法作用域中。
        // 统一显式绑定，避免 ReferenceError: edit is not defined。
        Object.assign(window, {
          newQ,
          edit,
          duplicate,
          manage,
          doStatus,
          versions,
          viewQuestion,
          closeModal,
          updateIndicator,
          updatePoints,
          saveEditor,
          downloadSnapshot,
          downloadBackup,
          pageTurn,
          qpReset,
          qpSubmit,
          qpCollect,
        });
        wbzyInit();
      }
    </script>
  </body>
</html>

const ALL=window.WBZY_GENERATED_QUESTIONS||[];const fw=document.querySelector('#fw'),search=document.querySelector('#search'),type=document.querySelector('#type'),points=document.querySelector('#points'),items=document.querySelector('#items');let selected='';const esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));let types=[...new Set(ALL.map(x=>x.typeName))].sort();type.innerHTML+=[...types].map(x=>`<option>${esc(x)}</option>`).join('');function render(){let key=search.value.trim().toLowerCase();let filtered=ALL.filter(x=>(!fw.value||x.framework===fw.value)&&(!type.value||x.typeName===type.value)&&(!key||[x.pointCode,x.pointName,x.sourceText,x.stem].join(' ').toLowerCase().includes(key)));let unique=[...new Map(filtered.map(x=>[x.pointCode,x])).values()];if(!unique.some(x=>x.pointCode===selected))selected=unique[0]?.pointCode||'';document.querySelector('#counter').textContent=`当前 ${unique.length} 个考评点 / ${filtered.length} 题`;points.innerHTML=unique.map(x=>`<button class="point ${x.pointCode===selected?'active':''}" data-code="${esc(x.pointCode)}"><b>${esc(x.pointCode)}</b><br>${esc(x.pointName)}<br><span class="count">${esc(x.framework)}</span></button>`).join('');let qs=filtered.filter(x=>x.pointCode===selected);document.querySelector('#selected').textContent=qs.length?`${qs[0].pointCode} · ${qs[0].pointName} · ${qs.length}题`:'无匹配考评点';items.innerHTML=qs.map(q=>`<article class="question"><h3>${esc(q.numberWithinPoint.toString().padStart(2,'0'))}. ${esc(q.typeName)} <span class="pill">${esc(q.suggestedLevel)}</span></h3><p class="muted">题号 ${esc(q.id)} · 来源 ${esc(q.sourceCode)}</p><div class="stem">${esc(q.stem)}</div>${q.options.length?`<div class="op">${q.options.map((x,i)=>`<div>${'ABCDE'[i]}. ${esc(x)}</div>`).join('')}</div>`:''}<details class="result"><summary>查看答案、评分要点与原文依据</summary><p><b>参考答案或要点：</b>${esc(q.answer!==null?Array.isArray(q.answer)?q.answer.map(i=>'ABCDE'[i]).join('、'):'ABCDE'[q.answe

function home(){let r=PlatformStore.read().records, pool=all(), usable=pool.filter(q=>q.status!=='已停用'&&q.status!=='草稿'&&q.status!=='待审定'&&q.status!=='退回修订'),latest=r[0];return `<div class="panel hero"><div><span class="tag">教师数智素养能力评价</span><h1>从测评到实训，形成清晰的能力提升路径</h1><p class="hint">围绕5个一级指标、13个二级指标、33个三级指标，先测评，再针对薄弱能力完成实训。模拟成绩不等于正式认证结果。</p><div class="actions"><button onclick="nav('exam')">开始综合测评 →</button><button class="outline" onclick="nav('practice')">进入专项实训</button></div></div><div class="hero-side"><b>${latest?latest.score+'分':'尚未测评'}</b><span>${latest?'最近一次自动评分':'测评后生成能力报告'}</span></div></div><div class="stats">${[['已发布可用题目',usable.length],['专项操作任务',usable.filter(q=>['practice','device','formula','prompt'].includes(q.type)).length],['测评与训练次数',r.length],['关联三级指标',33]].map(([k,v])=>`<div class="stat"><small>${k}</small><b>${v}</b></div>`).join('')}</div><div class="panel"><h2>建议完成的四个环节</h2><div class="journey">${[['01','了解测评','查看能力范围与作答规则'],['02','随机测评','覆盖知识、情境和操作任务'],['03','针对性实训','选择工具操作、设备排障等'],['04','查看能力报告','按指标发现短板并再次练习']].map(x=>`<div class="journey-item"><b>${x[0]}</b><strong>${x[1]}</strong><small>${x[2]}</small></div>`).join('')}</div></div><div class="panel"><h2>测评规则与注意事项</h2><p>综合测评根据发布题库随机抽题，不重复出题；专项实训可单独练习，不需先参加综合测评。交卷后展示总分、每题得分、指标表现和改进建议。</p><p class="hint">工具与硬件题为离线仿真，教学成果与操作证据的真实性、质量需要人工核验。成绩保存在当前浏览器；更换设备不会自动同步。</p><div class="actions"><button class="outline" onclick="nav('indicators')">查看能力指标说明</button>${latest?'<button class="outline" onclick="nav(&quot;reports&quot;)">查看最近报告</button>':''}</div></div>`}
function exam(){return `<h1>综合能力测评</h1><div class="panel"><div class="step-caption">第1步 / 配置测评范围　→　第2步 / 随机作答　→　第3步 / 提交与报告</div><h2>测评设置</h2><p class="hint">当前测评蓝图：${esc(AssessmentBlueprint.read().name)}。综合测评优先均衡覆盖一级指标，并按配置比例抽取实训题；不足时按实际题池组卷，未测指标不计分。</p><div class="formrow"><label class="field">教师姓名（选填）<input id="learner" value="${esc(learner)}" placeholder="用于本地报告标识"></label><label class="field">测评模式<select id="scope"><option value="mixed">综合测评（知识+实训）</option><option value="objective">知识与判断专项</option><option value="interactive">操作与情境专项</option></select></label><label class="field">能力等级<select id="level"><option value="">初、中、高混合</option><option>初级</option><option>中级</option><option>高级</option></select></label><label class="field">三级指标<select id="indicator"><option value="">全部指标（综合评价）</option>${INDICATOR_ANALYSIS.map(x=>`<option value="${x.code}">${x.code} ${esc(x.name)}</option>`).join('')}</select></label><label class="field">抽题数量<select id="count">${[5,10,15,20,30,40,50].map(x=>`<option ${x===+AssessmentBlueprint.read().count?'selected':''}>${x}</option>`).join('')}</select></label></div><div class="status">综合模式优先兼顾知识与实训；若当前筛选范围题量不足，会提示实际可抽数量。每道题可前后切换，提交前会检查未作答项目。</div><div class="actions"><button onclick="startExam()">生成随机试卷并开始 →</button><button class="outline" onclick="nav('home')">返回首页</button></div></div><div id="examhost"></div>`}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function selectedByBlueprint(pool,n,scope){
 const b=AssessmentBlueprint.read();let interactive=pool.filter(q=>['practice','device','formula','prompt'].includes(q.type)),basic=pool.filter(q=>!['practice','device','formula','prompt'].includes(q.type));
 if(scope==='interactive')return shuffle(interactive).slice(0,n);
 if(scope==='objective')return shuffle(basic).slice(0,n);
 const targetInteract=Math.round(n*(Number(b.interactivePercent)||0)/100),selected=[];
 function take(source,qty){for(const q of shuffle(source)){if(selected.length>=n||qty<=0)break;if(selected.some(z=>z.id===q.id))continue;selected.push(q);qty--}}
 // 先使一级指标尽可能均衡覆盖，题型配比随后尽力满足
 if(b.distribution==='balanced'){
  const roots=[...new Set(pool.map(q=>String(q.indicator||'').split('.')[0]))].sort();
  for(const root of roots){if(selected.length>=n)break;const choices=pool.filter(q=>String(q.indicator||'').startsWith(root+'.'));take(choices,1)}
 }
 take(interactive.filter(q=>!selected.some(x=>x.id===q.id)),Math.max(0,targetInteract-selected.filter(q=>interactive.includes(q)).length));
 take(basic.filter(q=>!selected.some(x=>x.id===q.id)),n-selected.length);
 take(pool,n-selected.length);
 return shuffle(selected);
}
function startExam(){let scope=$('scope').value,lv=$('level').value,ind=$('indicator').value,n=+$('count').value,pool=all().filter(q=>!['草稿','待审定','退回修订','已停用'].includes(q.status)&&(!lv||q.level===lv)&&(!ind||q.indicator===ind));
 let paper=selectedByBlueprint(pool,n,scope);
 if(!paper.length)return alert('当前条件下没有可用题目');
 learner=($('learner')?.value||'').trim();localStorage.setItem('teacher_learner_name',learner);
 const domains=new Set(paper.map(q=>String(q.indicator||'').split('.')[0]));
 if(paper.length<n||scope==='mixed'&&!ind&&domains.size<5){alert(`本次实际抽取${paper.length}题，覆盖${domains.size}/5个一级能力领域。题池或等级筛选不足时，报告不会将未测量领域视为低分。`)}
 session={paper,idx:0,answers:{},id:'TEST-'+Date.now(),learner,started:new Date().toISOString(),mode:scope,blueprint:AssessmentBlueprint.read().name};renderQ()}

function practice(){let pool=activePracticals().filter(q=>!['已停用','草稿','待审定','退回修订'].includes(q.status));return `<h1>专项可视化实训</h1><div class="panel"><div class="formrow"><label class="field">选择题目<select id="prSel">${pool.map((q,i)=>`<option value="${i}">${esc(q.id+' · '+q.indicator+' · '+q.stem)}</option>`).join('')}</select></label><button onclick="startPractice()">开始任务</button></div><p class="hint">33项指标逐项安排流程实训，另有8个可操作的设备、电子表格与AI提示词模拟。</p></div><div id="examhost"></div>`}
function startPractice(){session={paper:[activePracticals().filter(q=>!['已停用','草稿','待审定','退回修订'].includes(q.status))[+$('prSel').value]],idx:0,answers:{},id:'PRACTICE-'+Date.now(),started:new Date().toISOString()};renderQ()}
function setAnswer(value){session.answers[session.paper[session.idx].id]=value;renderQ()}
function setMulti(i,on){let q=session.paper[session.idx],arr=session.answers[q.id]||[];session.answers[q.id]=on?[...new Set([...arr,i])]:arr.filter(x=>x!==i)}
function workflow(q,a){let ord=a.order||q.shuffled;return `<h3>任务操作台 · 调整步骤次序</h3><p class="hint">请使用上下箭头将操作流程调整为正确执行顺序。系统将依据每一步位置评分。</p><div class="steps">${ord.map((idx,pos)=>`<div class="step"><b>${pos+1}</b><span>${esc(q.steps[idx])}</span><button onclick="stepMove(${pos},-1)">↑</button><button onclick="stepMove(${pos},1)">↓</button></div>`).join('')}</div><div class="grid" style="margin-top:15px"><label class="field">${esc(q.setting.prompt)}<select onchange="setField('permission',this.value)"><option value="">请选择</option>${q.setting.options.map((x,i)=>`<option value="${i}" ${a.permission==i?'selected':''}>${esc(x)}</option>`).join('')}</select></label><label class="field">${esc(q.required)}<textarea id="evidence" placeholder="例如：保存带日期和脱敏样例的课堂操作日志..." oninput="setFieldQuiet('evidence',this.value)">${esc(a.evidence||'')}</textarea></label></div>`}
function stepMove(i,d){let q=session.paper[session.idx],a=session.answers[q.id]||{},o=[...(a.order||q.shuffled)],j=i+d;if(j<0||j>=o.length)return;[o[i],o[j]]=[o[j],o[i]];a.order=o;session.answers[q.id]=a;renderQ()}
function setField(k,v){let q=session.paper[session.idx],a=session.answers[q.id]||{};a[k]=v;session.answers[q.id]=a;renderQ()}
function setFieldQuiet(k,v){let q=session.paper[session.idx],a=session.answers[q.id]||{};a[k]=v;session.answers[q.id]=a}
function device(q,a){let ok=a.port==='HDMI'&&a.source==='HDMI'&&a.sound==='HDMI';return `<div class="screen"><div class="device">💻 教师笔记本<br>输出：${esc(a.port||'未连接')}</div><div class="device" style="background:${ok?'#144e47':'#25303a'}">📺 交互屏<br>${ok?'✓ 信号正常，音频已联通':'⚠ 无信号 / 未完成联调'}</div></div><div class="grid" style="margin-top:15px"><label class="field">电脑视频输出接口<select onchange="setField('port',this.value)"><option value="">未连接</option><option ${a.port==='HDMI'?'selected':''}>HDMI</option><option ${a.port==='AUDIO'?'selected':''}>AUDIO</option></select></label><label class="field">交互屏信号源<select onchange="setField('source',this.value)"><option value="">未选择</option><option ${a.source==='HDMI'?'selected':''}>HDMI</option><option ${a.source==='VGA'?'selected':''}>VGA</option></select></label><label class="field">音频输出<select onchange="setField('sound',this.value)"><option value="">未配置</option><option ${a.sound==='HDMI'?'selected':''}>HDMI</option><option ${a.sound==='MUTE'?'selected':''}>MUTE</option></select></label></div><div class="status">模拟反馈：${ok?'连接可用（仍需在真实教室验证音量和显示效果）':'请检查视频接口、输入源和音频输出是否一致。'}</div>`}
function formula(q,a){let v=a.formula||'';let valid=/^=\s*AVERAGE\s*\(\s*B2\s*:\s*B6\s*\)$/i.test(v),result=valid?82:null;return `<h3>电子表格操作台</h3><table class="mini"><thead><tr><th>行</th><th>A · 组别</th><th>B · 成绩</th></tr></thead><tbody>${[78,82,91,67,92].map((x,i)=>`<tr><td>${i+2}</td><td>第${i+1}组</td><td>${x}</td></tr>`).join('')}<tr><td>7</td><td>平均成绩</td><td>${result??'—'}</td></tr></tbody></table><div class="formrow" style="margin-top:12px"><label class="field">在 B7 中输入公式<input style="min-width:260px" value="${esc(v)}" placeholder="=AVERAGE(B2:B6)" oninput="setFieldQuiet('formula',this.value)" onchange="setField('formula',this.value)"></label><button class="outline" onclick="renderQ()">执行公式</button></div><div class="status">${valid?'✓ 公式通过解析，计算结果为82':'输入公式并点击“执行公式”，系统将计算平均成绩。'}</div>`}
function prompt(q,a){let v=a.prompt||'',requirements=['对象','目标','输出','核验'],matched=requirements.filter(x=>v.includes(x));return `<h3>AI教学提示词编辑器 · 离线文本实训</h3><p class="hint">请自己撰写提示词，覆盖教学对象、教学目标、输出结构、事实核验与隐私保护；不调用AI模型。</p><textarea oninput="setFieldQuiet('prompt',this.value)" placeholder="例如：对象为...，目标...，输出...，请核验事实并避免输入学生隐私...">${esc(v)}</textarea><div class="actions"><button class="outline" onclick="renderQ()">检查提示词要素</button></div><div class="status">匹配的结构性关键词：${matched.join('、')||'暂无'}；隐私与人工核验需提交后自行审核，机器关键词检查不代表教学质量。</div>`}
function renderQ(){if(!session)return;let q=session.paper[session.idx],a=session.answers[q.id],type=q.type,interactive=['practice','device','formula','prompt'].includes(type),body='';if(type==='practice')body=workflow(q,a||{});else if(type==='device')body=device(q,a||{});else if(type==='formula')body=formula(q,a||{});else if(type==='prompt')body=prompt(q,a||{});else if(type==='order'){let arr=Array.isArray(a)?a:[];body=q.options.map((s,i)=>`<div class="pick"><select onchange="setLegacyStep(${i},this.value)"><option value="">执行顺序</option>${[1,2,3,4].map(j=>`<option value="${j-1}" ${arr[i]===j-1?'selected':''}>第${j}步</option>`).join('')}</select> ${esc(s)}</div>`).join('')}else if(type==='config'){body=`<label class="field">工具配置<select onchange="setAnswer(+this.value)"><option value="">请选择</option>${q.options.map((s,i)=>`<option value="${i}" ${a===i?'selected':''}>${esc(s)}</option>`).join('')}</select></label>`}else body=q.options.map((s,i)=>`<label class="check"><input type="${type==='multi'?'checkbox':'radio'}" name="q" ${type==='multi'?(a||[]).includes(i)?'checked':'':a===i?'checked':''} onchange="${type==='multi'?`setMulti(${i},this.checked)`:`setAnswer(${i})`}">${esc(s)}</label>`).join('');let html=`<div class="panel"><div class="hint">第${session.idx+1} / ${session.paper.length}题 · ${esc(q.id)} · <span class="tag">${esc(q.indicator)}</span><span class="tag">${esc(q.category)}</span><span class="tag">${esc(type)}</span><span class="tag">${esc(q.level)}</span></div><div class="progress"><div style="width:${Object.values(session.answers).filter(x=>x!==null&&x!==undefined&&x!==''&&(!Array.isArray(x)||x.length)).length*100/session.paper.length}%"></div></div><div class="question-palette">${session.paper.map((item,i)=>`<button class="${i===session.idx?'current':session.answers[item.id]!==undefined?'answered':'pending'}" onclick="jump(${i})" title="${esc(item.indicator)}">${i+1}</button>`).join('')}</div><h2>${esc(q.stem)}</h2>${interactive?`<p>${esc(q.scenario)}</p>`:''}<div class="workspace">${body}</div><div class="actions"><button class="outline" onclick="move(-1)" ${session.idx===0?'disabled':''}>上一题</button><button class="outline" onclick="move(1)" ${session.idx===session.paper.length-1?'disabled':''}>下一题</button><button onclick="finish()">提交并评分</button></div><small>操作状态自动记录。实训不等于真实软件、真实硬件操作考核。</small></div>`;let host=$('examhost')||$('view');host.innerHTML=html}
function setLegacyStep(i,v){let q=session.paper[session.idx],a=session.answers[q.id]||[null,null,null,null];a[i]=v===''?null:Number(v);session.answers[q.id]=a;renderQ()}
function jump(i){session.idx=i;renderQ()}
function move(d){session.idx=Math.max(0,Math.min(session.paper.length-1,session.idx+d));renderQ()}
function grade(q,a){if(!a&&a!==0)return {score:0,note:'未作答'};if(q.type==='practice'){let order=a.order||q.shuffled,steps=order.reduce((n,v,i)=>n+(i===v?1:0),0);let s=steps*15+(+a.permission===q.setting.correct?20:0)+(String(a.evidence||'').trim().length>=12?20:0);return {score:s,note:'流程 '+steps+'/4；权限 '+(+a.permission===1?'正确':'待改进')+'；证据文字仅检查长度，尚待人工审核'}}if(q.type==='device')return {score:(a.port==='HDMI'?35:0)+(a.source==='HDMI'?35:0)+(a.sound==='HDMI'?30:0),note:'接口、信号源与音频联动'};if(q.type==='formula')return {score:/^=\s*AVERAGE\s*\(\s*B2\s*:\s*B6\s*\)$/i.test(a.formula||'')?100:0,note:'标准公式 =AVERAGE(B2:B6)，结果 82'};if(q.type==='prompt'){let text=a.prompt||'',keys=['对象','目标','输出','核验','隐私'];return {score:keys.filter(k=>text.includes(k)).length*20,note:'提示词要素关键词覆盖度，不能代替专家评价'}}if(q.type==='order'){let yes=Array.isArray(a)&&new Set(a).size===4&&q.answer.every((v,i)=>a[v]===i);return {score:yes?100:0,note:q.explain}}if(Array.isArray(q.answer)){let yes=Array.isArray(a)&&q.answer.length===a.length&&q.answer.every(i=>a.includes(i));return{score:yes?100:0,note:q.explain}}return{score:q.answer===a?100:0,note:q.explain}}
function finish(){let missing=session.paper.filter(q=>{let a=session.answers[q.id];return a===undefined||a===null||a===''||(Array.isArray(a)&&!a.length)});if(missing.length&&!confirm('还有'+missing.length+'道题未作答或未操作，确定仍要提交吗？'))return;if(!confirm('提交本次测评并生成成绩记录？'))return;let items=session.paper.map(q=>{let a=session.answers[q.id],g=grade(q,a);return {q,ans:a??null,ok:g.score>=60,score:g.score,note:g.note}}),sum=items.reduce((n,x)=>n+x.score,0),rec={id:session.id,started:session.started,completed:new Date().toISOString(),total:items.length,correct:items.filter(x=>x.score===100).length,score:Math.round(sum/items.length),learner:session.learner||learner,mode:session.mode||'专项实训',items};let st=PlatformStore.read();st.records.unshift(rec);st.records=st.records.slice(0,100);PlatformStore.write(st);session=null;nav('reports');detail(0)}
function indicators(){const tree=window.INDICATOR_TREE||{level1:[],level2:[],level3:[]};const cnt=id=>all().filter(q=>String(q.indicator||'')===id).length;return `<h1>教师数智素养能力指标体系</h1><div class="panel"><p class="hint">依据指标体系组织为5个一级、13个二级、33个三级指标。点击一级、二级展开，查看指标描述、关键行为、推荐评价方法和关联题量。</p><div class="stats">${[['一级指标',tree.level1.length],['二级指标',tree.level2.length],['三级指标',tree.level3.length],['可用题目',all().length]].map(([n,v])=>`<div class="stat"><small>${n}</small><b>${v}</b></div>`).join('')}</div></div><div class="panel"><div class="formrow"><label class="field">按一级指标筛选<select id="indicatorLevel" onchange="filterIndicators()"><option value="">全部一级指标</option>${tree.level1.map(x=>`<option value="${x.code}">${x.code} ${esc(x.name)}</option>`).join('')}</select></label><label class="field">搜索指标<input id="indicatorSearch" placeholder="名称、编码或能力描述" oninput="filterIndicators()"></label></div><div id="indicatorTreeView">${renderIndicatorTree('', '')}</div></div>`}
function renderIndicatorTree(chosen='',word=''){let tree=window.INDICATOR_TREE||{level1:[],level2:[],level3:[]};let a=INDICATOR_ANALYSIS||[];let matches=x=>!word||[x.code,x.name,x.description,a.find(y=>y.code===x.code)?.desc].join(' ').toLowerCase().includes(word.toLowerCase());return tree.level1.filter(l=>!chosen||l.code===chosen).map(l=>{let subs=tree.level2.filter(b=>b.parent===l.code).map(b=>{let thirds=tree.level3.filter(t=>t.parent===b.code).filter(t=>!word||matches(t)||matches(b)||matches(l));if(word&&!thirds.length&&!matches(b)&&!matches(l))return '';return `<details class="ind-second" ${word?'open':''}><summary><span><b>${esc(b.code)} ${esc(b.name)}</b><small>${esc(b.description||'')}</small></span><span class="tag">${thirds.length}项三级指标</span></summary><div class="ind-third">${thirds.map(t=>{let info=a.find(z=>z.code===t.code)||{};return `<article class="ind-item"><div><strong>${esc(t.code)} ${esc(t.name)}</strong><span class="tag">关联 ${all().filter(q=>String(q.indicator)===t.code).length} 题</span></div><p>${esc(t.description||info.desc||'暂无描述')}</p><div class="hint">关键行为：${esc(info.desc||'根据能力要求开展评价')}</div><div class="hint">建议测评：${esc(info.method||'待配置')}　｜　评价证据：${esc(info.evidence||'待配置')}</div></article>`}).join('')}</div></details>`}).filter(Boolean).join('');if(word&&!subs&&!matches(l))return '';return `<details class="ind-first" ${word?'open':''}><summary><span><b>${esc(l.code)} ${esc(l.name)}</b><small>${esc(l.description||'')}</small></span><span class="tag">${tree.level2.filter(x=>x.parent===l.code).length}项二级</span></summary>${subs||'<p class="hint">没有符合搜索条件的三级指标。</p>'}</details>`}).filter(Boolean).join('')||'<div class="empty">没有找到相应指标。</div>'}
function filterIndicators(){document.getElementById('indicatorTreeView').innerHTML=renderIndicatorTree(document.getElementById('indicatorLevel').value,document.getElementById('indicatorSearch').value.trim())}
function demoReport(){let types=['choice','multi','practice','device','formula','prompt','order'];let items=(window.INDICATOR_TREE?.level3||[]).map((x,i)=>{let val=[89,78,94,71,84,62,91,75,68,87,74,82,57,90,72,86,69,80,66,77,92,71,63,88,74,83,67,85,76,59,81,73,90][i];return {q:{id:'DEMO-'+String(i+1).padStart(2,'0'),indicator:x.code,stem:'示例任务：'+x.name+' · '+(x.description||'依据三级指标完成对应能力测试').slice(0,72),type:types[i%types.length],level:['初级','中级','高级'][i%3],explain:'本题为示例评价数据，正式测评需完成对应题目并核验操作证据。'},score:val,ok:val>=60,note:val<70?'示例反馈：需要强化操作实践，结合岗位任务补训。':'示例反馈：基本达到本次示例任务要求。',ans:{evidence:'示例数据，不代表真实操作证据'}}});let score=Math.round(items.reduce((n,x)=>n+x.score,0)/items.length);return {id:'DEMO-REPORT-2026',learner:'示例教师（虚拟）',completed:'2026-10-29T10:00:00',started:'2026-10-29T09:00:00',total:items.length,correct:items.filter(x=>x.score===100).length,score,mode:'示例综合测评 · 非真实成绩',items}}
function showDemoReport(){let r=demoReport();const el=document.getElementById('details');el.innerHTML='<div class="demo-banner"><strong>示例报告 · 虚拟教师 / 模拟成绩</strong><span>仅用于演示页面布局和一级、二级、三级指标分析；不会写入测评历史，不作为认证或真实评价依据。</span><button class="outline" onclick="nav(\'reports\')">关闭示例</button></div>'+renderCompetenceReport(r,[r]);el.scrollIntoView({behavior:'smooth',block:'start'})}
function reports(){let r=PlatformStore.read().records;return `<h1>我的测评与实训报告</h1><div class="panel"><div class="demo-callout"><div><b>查看个人能力画像示例</b><p class="hint">包含5个一级、13个二级、33个三级指标的示范成绩、能力轮盘、优势短板与提升路径。虚拟数据不会计入你的历史成绩。</p></div><button onclick="showDemoReport()">查看示例报告 →</button></div><p class="hint">查看历次成绩、指标表现和逐题建议。自动得分用于学习诊断，不能代替正式专家审核或能力认证。</p>${!r.length?'<div class="empty">尚无测评记录。可先打开示例报告了解完整呈现方式，或完成一次综合测评生成自己的真实报告。<div class="actions"><button onclick="nav(&quot;exam&quot;)">开始测评</button><button class="outline" onclick="showDemoReport()">查看示例报告</button></div></div>':`<div class="overflow"><table><tr><th>完成时间</th><th>教师</th><th>测评类型</th><th>题量</th><th>自动分数</th><th>操作</th></tr>${r.map((x,i)=>`<tr><td>${esc(new Date(x.completed).toLocaleString('zh-CN'))}</td><td>${esc(x.learner||'未填写')}</td><td>${esc(x.mode||'历史测评')}</td><td>${x.total}</td><td><b>${x.score??Math.round(x.correct/x.total*100)}</b>/100</td><td><button class="outline" onclick="detail(${i})">查看报告</button></td></tr>`).join('')}</table></div><div class="actions"><button onclick="downloadRecords()">导出全部成绩 JSON</button></div>`}</div><div id="details"></div>`}
function retrain(){const records=PlatformStore.read().records||[],last=records[0];const weak=last?last.items.filter(x=>Number(x.score)<70):[],ids=[...new Set(weak.map(x=>x.q?.indicator).filter(Boolean))];return `<h1>补训与复测</h1><div class="panel"><h2>依据最近一次测评安排针对性训练</h2><p class="muted">${last?'最近一次自动评分：'+last.score+'分；需要补强的题目'+weak.length+'道。':'尚无真实测评记录，先完成一次测评，系统将根据实际低分题推荐训练。'}</p>${ids.length?`<div class="row">${ids.map(id=>`<button class="secondary" onclick="nav('practice')">${esc(id)} · 进入专项实训</button>`).join('')}</div>`:'<p class="hint">可以先参加专项实训熟悉操作过程。</p>'}<div class="actions"><button onclick="nav('practice')">进入专项实训</button><button class="outline" onclick="nav('exam')">重新随机测评</button><button class="outline" onclick="nav('reports')">查看能力报告</button></div><p class="hint">复测会重新随机生成试卷并留存新的成绩记录。不同试卷的得分仅用于训练趋势参考，未经等值校准不能直接认定真实能力增幅。</p></div>`}
function detail(i){let allRecords=PlatformStore.read().records||[];let r=allRecords[i];if(!r)return;document.getElementById('details').innerHTML=renderCompetenceReport(r,allRecords)+'<div class="panel"><h3>下一步：补训与复测</h3><p class="hint">根据实际低分考评项开展专项训练，然后重新随机抽题测评。</p><button onclick="nav(&quot;retrain&quot;)">进入补训与复测 →</button></div>';document.getElementById('details').scrollIntoView({behavior:'smooth',block:'start'});}

function downloadRecords(){let u=URL.createObjectURL(new Blob([JSON.stringify(PlatformStore.read().records,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='assessment-records.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
nav(['home','exam','practice','reports','retrain','indicators'].includes(location.hash.slice(1))?location.hash.slice(1):'home');

<script>
(function(){
 let zoom=null,scale=1,offsetX=0,offsetY=0,drag=null;
 const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
 function sync(){if(!zoom)return;zoom.svg.style.transform=`translate(-50%,-50%) translate(${offsetX}px,${offsetY}px) scale(${scale})`;zoom.pct.textContent=Math.round(scale*100)+'%'}
 function resize(v){scale=clamp(v,.6,5);sync()}
 function close(){if(!zoom)return;zoom.root.remove();zoom=null;document.removeEventListener('keydown',keyHandler);document.body.style.overflow=''}
 function keyHandler(e){if(e.key==='Escape')close();if(e.key==='+'||e.key==='=')resize(scale+.25);if(e.key==='-')resize(scale-.25);if(e.key==='0'){scale=1;offsetX=offsetY=0;sync()}}
 window.openStudentWheelZoom=function(){
  const source=document.querySelector('#details .rv-wheel-v9')||document.querySelector('#details .rv9-wheel-container svg');
  if(!source)return;close();scale=1;offsetX=offsetY=0;
  const root=document.createElement('div');root.className='student-zoom-overlay';root.setAttribute('role','dialog');root.setAttribute('aria-modal','true');root.setAttribute('aria-label','教师数智素养能力轮盘放大查看');
  root.innerHTML=`<div class="student-zoom-header"><strong>教师数智素养 · 能力轮盘放大查看</strong><div class="zoom-controls"><button data-action="minus">－ 缩小</button><span data-percent aria-live="polite">100%</span><button data-action="plus">＋ 放大</button><button data-action="reset">重置</button><button data-action="close">✕ 关闭</button></div></div><div class="student-zoom-stage"></div><div class="student-zoom-info" aria-live="polite">点击扇区查看指标，拖动画面查看细节</div><div class="student-zoom-help">鼠标滚轮缩放 · 拖拽平移 · Esc 关闭 · 缩放范围 60%—500%</div>`;
  const stage=root.querySelector('.student-zoom-stage'),svg=source.cloneNode(true),info=root.querySelector('.student-zoom-info');stage.append(svg);document.body.append(root);document.body.style.overflow='hidden';
  zoom={root,stage,svg,pct:root.querySelector('[data-percent]')};sync();
  root.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{let a=b.dataset.action;if(a==='close')close();else if(a==='plus')resize(scale+.25);else if(a==='minus')resize(scale-.25);else{scale=1;offsetX=offsetY=0;sync()}}));
  stage.addEventListener('wheel',e=>{e.preventDefault();resize(scale+(e.deltaY<0?.15:-.15))},{passive:false});
  stage.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,ox:offsetX,oy:offsetY,moved:false};stage.setPointerCapture(e.pointerId)});
  stage.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>6)drag.moved=true;if(drag.moved){offsetX=drag.ox+dx;offsetY=drag.oy+dy;sync()}});
  stage.addEventListener('pointerup',()=>{drag=null});stage.addEventListener('pointercancel',()=>{drag=null});
  svg.addEventListener('mouseover',e=>{let t=e.target.closest('[data-code]');if(t){let title=t.querySelector('title');info.textContent=title?.textContent||'点击指标查看详细信息'}});
  svg.addEventListener('click',e=>{let t=e.target.closest('[data-code]');if(t){let title=t.querySelector('title');info.textContent=(title?.textContent||'指标已选中')+' · 详细分析同步显示在原报告中'}});
  document.addEventListener('keydown',keyHandler);root.querySelector('[data-action="close"]').focus();
 };
 // Report content is dynamically rendered. Insert button once the demo or a real report appears.
 const observer=new MutationObserver(()=>{const details=document.getElementById('details');if(!details)return;const container=details.querySelector('.rv9-wheel-container');if(container&&!container.querySelector('.student-wheel-toolbar')){const bar=document.createElement('div');bar.className='student-wheel-toolbar';bar.innerHTML='<button type="button" onclick="openStudentWheelZoom()" aria-label="放大查看个人能力轮盘">⛶ 放大查看轮盘</button>';container.prepend(bar)}});
 observer.observe(document.body,{subtree:true,childList:true});
})();

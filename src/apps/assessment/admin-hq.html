function generateFullPrompt(){let i=lookup($('indicator').value),a=INDICATOR_ANALYSIS.find(x=>x.code===i.code)||{},t=$('aType').value;let ap=pointFor($('agentPoint')?.value),l=$('aLevel').value,extra=$('aReq').value.trim(),l2=INDICATOR_TREE.level2.find(x=>x.code===i.parent),l1=INDICATOR_TREE.level1.find(x=>x.code===i.root);return `你是职业教育教师数智素养评价领域的高级命题专家，需依据下面的能力指标完成高质量命题。\n\n【指标约束】\n一级指标：${l1?.code||''} ${l1?.name||''}\n二级指标：${l2?.code||''} ${l2?.name||''}\n三级指标：${i.code} ${i.name}\n三级指标原文：${i.description}\n能力等级：${l}\n考评点：${ap?ap.code+' '+ap.name:'尚未选择（必须先关联考评点）'}\n可观察行为：${ap?.action||''}\n评价证据：${ap?.evidence||''}\n题型：${typeName(t)}（代码${t}）\n推荐评价方法：${a.method||'依据实际能力设计'}\n预期证据：${a.evidence||'可观察的操作及结果'}\n\n【专属命题规范】\n${$('promptEditor')?.value||promptText(t)}\n\n【个性化要求】\n${extra||'职业院校真实教学场景；内容原创、可复核、无敏感学生信息。'}\n${ap?`\n【考评点专属提示词】\n${pointPromptValue(ap,t)}\n`:""}\n【质量红线】\n1. 不得将操作指标简化为纯识记题，题型必须反映指标动作。\n2. 避免一题多义、争议答案、虚构法规或产品界面。\n3. 输出含：题目名称、情境与任务、交互界面/操作项、正确答案/目标状态、逐步解析、评分量规、错误反馈、关键证据、等级依据。\n4. 对需要人工评阅的成果，明确不可自动判定的部分。\n5. 以结构化JSON输出，字段至少包括 indicator,type,level,stem,options,answer,explain,config,rubric,evidence,qualityChecks；不适用字段给null。\n6. 最后检查每个题目是否真正覆盖指标动作、可在前端实现及可重复评分。\n\n仅输出一题，勿复制已存在试题。`}
function refreshFullPrompt(){if($('fullPrompt'))$('fullPrompt').value=generateFullPrompt()}
function savePromptTemplate(){let type=$('aType').value,text=$('promptEditor').value.trim();if(!text){alert('提示词不能为空');return}let o=getPromptOverrides();o[type]=text;localStorage.setItem(PROMPT_KEY,JSON.stringify(o));promptChanged();refreshFullPrompt();alert('当前题型的提示词已保存到本浏览器')}
function resetPromptTemplate(){let type=$('aType').value,o=getPromptOverrides();delete o[type];localStorage.setItem(PROMPT_KEY,JSON.stringify(o));promptChanged();refreshFullPrompt()}
function copyPrompt(){refreshFullPrompt();let val=$('fullPrompt').value;if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(val).then(()=>alert('已复制完整提示词'),()=>fallbackCopy())}else fallbackCopy();function fallbackCopy(){let el=$('fullPrompt');el.focus();el.select();try{document.execCommand('copy');alert('已复制提示词')}catch{alert('请手动复制文本框内容')}}}
function exportPrompts(){let blob=new Blob([JSON.stringify({defaults:window.TEACHER_PROMPT_LIBRARY,custom:getPromptOverrides()},null,2)],{type:'application/json'});let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='教师数智素养_11题型命题提示词.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function agent(){return mainIntro('智能体辅助命题 · 按题型专业提示词库','11种题型各自配有命题规则、操作任务和评分结构。完整提示词自动关联三级指标；当前仅提供离线草案生成和大模型可用提示词，不假装已经连接真实AI。')+`<div class="panel"><div class="formgrid"><div class="field"><label>目标三级指标</label>${selectIndicator('1.1.2')}</div><div class="field"><label>指定考评点</label><select id="agentPoint" onchange="refreshFullPrompt()">${pointRecords.filter(p=>p.level3Code==='1.1.2').map(p=>`<option value="${p.code}">${E(p.code+' '+p.name)}</option>`).join('')}</select></div><div class="field"><label>能力等级</label><select id="aLevel" onchange="refreshFullPrompt()"><option>初级</option><option>中级</option><option>高级</option></select></div><div class="field"><label>生成题型</label><select id="aType" onchange="promptChanged();refreshFullPrompt()">${state.types.filter(t=>!t.disabled).map(t=>`<option value="${E(t.code)}">${E(t.name)}</option>`).join('')}</select></div><div class="field wide"><label>额外命题要求</label><textarea id="aReq" oninput="refreshFullPrompt()" placeholder="例如：智慧教室投影故障，包含故障初始状态、可操作控件和评分节点……"></textarea></div></div><div class="panel" style="margin:14px 0;background:#f6fafb"><div class="row" style="justify-content:space-between"><h3 id="promptName" style="margin:0">题型专属提示词</h3><span class="pill" id="promptStatus">系统默认模板</span></div><p class="muted">编辑并保存当前题型的命题规范，切换题型会自动载入对应模板。</p><textarea id="promptEditor" style="width:100%;min-height:210px" oninput="refreshFullPrompt()"></textarea><div class="row"><button onclick="savePromptTemplate()">保存当前题型模板</button><button class="secondary" onclick="resetPromptTemplate()">恢复默认模板</button><button class="secondary" onclick="exportPrompts()">导出全部11种提示词</button></div></div><div class="panel" style="margin:14px 0"><h3>完整命题提示词（自动拼接指标、等级及题型规则）</h3><textarea id="fullPrompt" style="width:100%;min-height:230px" readonly></textarea><div class="row"><button onclick="copyPrompt()">复制完整提示词</button><button class="secondary" onclick="makeDraft()">离线生成任务草案</button></div><p class="muted">将提示词粘贴到可用的大模型进行实际命题；产出需要人工校审并转换为当前前端支持的数据结构后才能发布。</p></div><div id="draftBox"></div></div>`}
function makeDraft(){let i=lookup($('indicator').value),a=INDICATOR_ANALYSIS.find(x=>x.code===i.code)||{},type=$('aType').value,level=$('aLevel').value,req=$('aReq').value.trim();let acts=a.evidence||'识别任务目标 → 规范执行 → 保存过程证据 → 验证结果';let stem=`【${level}·${i.name}】职业院校教师在真实教学工作中，需完成以下数智素养任务：${i.description}\n情境要求：${req||a.method||'以实际课堂教学为背景'}。\n请完成可观察的操作，并提交结果与过程证据。`;draft={assessmentPointCode:$('agentPoint')?.value||'',indicator:i.code,indicatorName:i.name,level,type,stem,options:['明确操作目标','检查环境与权限','执行关键步骤','验证输出并记录证据'],answer:type==='single'?0:type==='multiple'?[0,1]:type==='order'?[0,1,2,3]:{steps:acts.split(/\s*→\s*/),evidenceRequired:true},explain:`评分建议（待专家细化）：指标要求——${i.description}\n可观察证据链——${acts}\n评分需覆盖完成度、规范性与证据质量；未经人工审核不得自动发布。`,category:a.method||'情境实训',origin:'离线规则辅助命题',status:'草稿'};$('draftBox').innerHTML=`<div class="hint"><b>生成结果：待完善草案，不等同于正式试题</b><pre>${E(JSON.stringify(draft,null,2))}</pre><button onclick="acceptDraft()">转人工编辑并完善</button></div>`}
function acceptDraft(){if(!draft)return;view='manual';nav();$('main').innerHTML=editor(draft,draft.indicator);$('type').value=draft.type;formType()}
let bankFramework='teacher',bankQuery='',bankPage=1;

];return sets.flatMap(entry=>entry.items.map(q=>({...q,_source:entry.source})));}

let wbzyBankReady=false;
// 兜底机制：即使本地 file:// 环境屏蔽子页消息，也不会长期覆盖真实题库页面。
let wbzyBankGuard=null;
function wbzyStartBankGuard(){clearTimeout(wbzyBankGuard);wbzyBankGuard=setTimeout(()=>{let loader=document.getElementById('wbzy-bank-loading');if(loader){loader.style.display='none';const frame=document.getElementById('wbzy-bank-frame');if(frame)frame.style.visibility='visible';}},12000)}

function wbzyBankProgress(event){const frame=document.getElementById('wbzy-bank-frame');if(!frame||event.source!==frame.contentWindow||!event.data||event.data.kind!=='wbzy-bank-progress')return;const data=event.data,p=Math.max(4,Math.min(100,Number(data.percent)||4));const bar=document.getElementById('wbzy-bank-bar'),count=document.getElementById('wbzy-bank-count'),stage=document.getElementById('wbzy-bank-stage');if(bar)bar.style.width=p+'%';if(count)count.textContent=p+'%';if(stage)stage.textContent=data.stage||'正在整理试题…';if(data.ready){clearTimeout(wbzyBankGuard);const loader=document.getElementById('wbzy-bank-loading');if(loader)loader.style.display='none';frame.style.visibility='visible';wbzyBankReady=true;}if(data.error){if(stage)stage.textContent='加载失败：'+data.error;const loader=document.getElementById('wbzy-bank-loading');if(loader)loader.style.display='none';frame.style.visibility='visible';}}

function updateBankResults(){let host=$('bankResults');if(!host)return;let all=bankFramework==='general'?generalQuestions():state.questions;let kw=bankQuery.trim().toLowerCase();let rows=all.filter(q=>!kw||[q.id,q.stem,q.indicator,q.indicatorName,q.pointCode,q.assessmentPointCode,q.category,q.type,q.status,q._source].join(' ').toLowerCase().includes(kw));let totalPages=Math.max(1,Math.ceil(rows.length/15));bankPage=Math.min(Math.max(1,bankPage),totalPages);let pageRows=rows.slice((bankPage-1)*15,bankPage*15);let table;
if(bankFramework==='teacher'){table=`<div class="scroll"><table><thead><tr><th>题号</th><th>指标 / 考评点</th><th>题型 / 等级</th><th>题干</th><th>状态 / 版本</th><th>维护操作</th></tr></thead><tbody>${pageRows.map(q=>{let i=lookup(q.indicator),b=INDICATOR_TREE.level2.find(x=>x.code===i?.parent),a=INDICATOR_TREE.level1.find(x=>x.code===i?.root);return `<tr><td>${E(q.id)}</td><td class="tiny">${E(a?.name)} / ${E(b?.name)}<div><b>${E(q.indicator)} ${E(i?.name)}</b></div><div>考评点：${E(q.assessmentPointCode||'待归属')}</div></td><td>${E(typeName(q.type))}<div class="tiny muted">${E(q.level)}</div></td><td>${E(q.stem).slice(0,130)}</td><td><span class="pill">${E(q.status)}</span><div class="tiny muted">V${E(q.version||1)}</div></td><td><button class="secondary" onclick="editQuestion('${E(q.id)}')">编辑</button> <button class="secondary" onclick="duplicate('${E(q.id)}')">复制</button> <button class="warn" onclick="removeQ('${E(q.id)}')">删除</button></td></tr>`}).join('')}</tbody></table></div>`}
else{table=`<div class="scroll"><table><thead><tr><th>题号</th><th>能力单元 / 考评点</th><th>来源 / 题型</th><th>题干</th><th>管理状态</th><th>操作</th></tr></thead><tbody>${pageRows.map(q=>`<tr><td>${E(q.id)}</td><td><b>${E(q.indicator||'')} ${E(q.indicatorName||'')}</b><div class="tiny muted">${E(q.pointCode||'待关联考评点')}</div></td><td>${E(q._source)}<div class="tiny muted">${E(q.type||q.mode||'交互')} · ${E(q.level||'')}</div></td><td>${E(q.stem).slice(0,150)}</td><td><span class="pill">训练样例</span><div class="tiny muted">未审定</div></td><td><button class="secondary" onclick="viewGeneralQuestion('${E(q.id)}')">查看</button></td></tr>`).join('')}</tbody></table></div>`}
host.innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:12px"><b>共 ${rows.length} 道 · ${bankFramework==='general'?'通用数智能力':'教师素智素养'}</b><span class="muted">第 ${bankPage} / ${totalPages} 页</span></div>${table}<div class="row" style="justify-content:center;margin-top:15px"><button class="secondary" ${bankPage<=1?'disabled':''} onclick="bankPageChange(-1)">上一页</button><span class="muted">每页15道</span><button class="secondary" ${bankPage>=totalPages?'disabled':''} onclick="bankPageChange(1)">下一页</button></div>`;}
function viewGeneralQuestion(id){let q=generalQuestions().find(x=>x.id===id);if(!q)return;const detail=[['题号',q.id],['所属体系','通用数智能力'],['能力单元',`${q.indicator||''} ${q.indicatorName||''}`],['考评点',q.pointCode||''],['来源',q._source],['题型',q.type||q.mode||''],['题干',q.stem],['题目数据（只读）',JSON.stringify(q,null,2)]];const el=document.createElement('div');el.className='type-overlay';el.id='generalQuestionModal';el.innerHTML=`<div class="type-modal" style="max-width:820px"><div class="h"><h2>通用能力试题详情</h2><button class="secondary" onclick="document.getElementById('generalQuestionModal').remove()">关闭</button></div>${detail.map(([key,val])=>`<div style="margin:12px 0"><b>${E(key)}</b><div style="white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f8f9;padding:10px;border-radius:8px;margin-top:5px">${E(val)}</div></div>`).join('')}</div>`;el.addEventListener('click',e=>{if(e.target===el)el.remove()});document.body.appendChild(el);}

function exportJS(){let normal=state.questions.filter(q=>q.status==='已发布'&&state.types.some(t=>t.code===q.type&&!t.disabled)&&group(q)==='basic'&&['single','multiple','order','config'].includes(q.type));let pr=state.questions.filter(q=>q.status==='已发布'&&state.types.some(t=>t.code===q.type&&!t.disabled)&&group(q)==='practical'&&q.type==='practice');download('question-bank.js','const BANK='+JSON.stringify(normal,null,2)+';\n');download('practical-bank.js','window.PRACTICAL_BANK='+JSON.stringify(pr,null,2)+';\n');alert('已请求下载两份JS文件；将两份文件替换部署目录同名文件。注意浏览器可能限制连续下载。')}
async function importAll(el){let f=el.files[0];if(!f)return;try{let s=JSON.parse(await f.text());if(!Array.isArray(s.questions)||!Array.isArray(s.types))throw Error('备份格式不符');if(!confirm('导入将覆盖当前管理数据，确认？'))return;state=s;persist();render()}catch(e){alert('导入失败：'+e.message)}finally{el.value=''}}
function render(){let page={home,indicators,masterdata:()=>window.WBZYPointMaster.page(),points:assessmentPoints,plans,blueprint,types,manual:()=>editor(null),agent,bank,review,data}[view];let html=page?page():window.WBZYAgents?.page(view)||'<div class=panel>页面不可用</div>';$('main').innerHTML=html;if(view==='masterdata')window.WBZYPointMaster?.after();if(view==='points'){updatePointResults();cleanPointStrayBraces();}if(view==='bank'){wbzyBankReady=false;}if(view==='plans')initPlanMode();if(view==='types')updateTypeCards();if(view.startsWith('agent'))window.WBZYAgents?.after(view)}
if(location.hash==='#home')view='home';else if(location.hash==='#plans')view='plans';else if(location.hash==='#points')view='points';else if(location.hash==='#manual'||location.hash==='#agent'){planMode=location.hash.slice(1);view='plans'}else if(location.hash==='#review'){bankMode='review';view='bank'}if(location.hash.startsWith('#agent'))view=location.hash.slice(1);nav();render();

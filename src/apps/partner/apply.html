<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>合作伙伴申请 · 职业能力公共服务平台</title>
    <link rel="stylesheet" href="../assets/partner-workspace-v7237.css?v=7237" />
  </head>
  <body>
    <header class="ep-header">
      <a href="../site/index.html" class="ep-brand"
        ><img src="../assets/mveri-logo.png" alt="研究院徽标" />合作伙伴平台 · 合作申请</a
      ><a href="../site/index.html">返回官网</a>
    </header>
    <main class="ep-shell">
      <section class="ep-card" style="max-width: 760px; margin: 30px auto">
        <h1>申请成为生态合作伙伴</h1>
        <p class="ep-muted">
          面向职业能力标准建设、能力测评、课程培训、技术工具和资源服务等领域的机构。提交后由总部进行资质审核，审核通过且配置账号后才可访问合作工作台。
        </p>
        <div class="ep-note">
          当前为离线演示：申请只保存在本浏览器，不会提交至研究院。请勿填写真实敏感信息或正式商业申请。
        </div>
        <form id="apply">
          <label class="ep-field">机构名称<input name="name" maxlength="80" required /></label
          ><label class="ep-field"
            >机构类型<select name="type">
              <option>科技企业</option>
              <option>职业院校</option>
              <option>央企</option>
              <option>教育科技</option>
              <option>培训机构</option>
              <option>行业组织</option>
              <option>其他</option>
            </select></label
          ><label class="ep-field">联系人<input name="contact" required maxlength="30" /></label
          ><label class="ep-field">联系邮箱<input type="email" name="email" maxlength="90" required /></label
          ><label class="ep-field"
            >拟合作方向<textarea
              name="description"
              maxlength="500"
              required
              placeholder="请说明拟参与的能力标准、测评、培训或资源共建方向"
            ></textarea></label
          ><label class="ep-field"
            ><span
              ><input type="checkbox" name="agree" required style="width: auto" />
              我已知晓这是本机演示提交，不会实际发送申请</span
            ></label
          ><button class="ep-button">提交演示申请</button>
        </form>
        <p id="result" role="status"></p>
        <p><a href="../auth/partner.html">已有合作伙伴账号？进入登录</a></p>
      </section>
    </main>
    <script src="../assets/partner-registry-v7237.js?v=7237"></script>
    <script>
      document.getElementById("apply").onsubmit = (e) => {
        e.preventDefault();
        const d = new FormData(e.target),
          api = window.MVERI_PARTNER_REGISTRY;
        const name = String(d.get("name") || "").trim();
        if (api.get().some((x) => x.name === name)) {
          document.getElementById("result").textContent = "本浏览器已有同名机构，请联系总部核对演示申请记录。";
          return;
        }
        const r = {
          id: "EP-" + Date.now(),
          name,
          type: d.get("type"),
          contact: String(d.get("contact")),
          email: String(d.get("email")),
          description: String(d.get("description")),
          status: "待审核",
          scope: [],
          account: "",
          password: "",
          projects: [],
          resources: [],
          created: new Date().toISOString().slice(0, 10),
        };
        api.audit(r, "提交入驻申请", "待总部审核");
        document.getElementById("result").textContent =
          "演示申请已保存，编号：" + r.id + "。请在同一浏览器的总部工作台查看审核。";
        e.target.reset();
      };
    </script>
  </body>
</html>

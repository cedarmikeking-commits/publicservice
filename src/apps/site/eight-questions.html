<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>现代职业教育研究院公共服务平台 · 离线任务体验</title>
    <style>
      :root {
        font-family:
          Inter,
          system-ui,
          -apple-system,
          "PingFang SC",
          "Microsoft YaHei",
          sans-serif;
        color: #292640;
        background: #f7f7fc;
        font-synthesis: none;
        --ink: #203650;
        --muted: #647895;
        --purple: #315cc5;
        --line: #dfe7f5;
        --mint: #ddf4ee;
        --red: #bb5362;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-size: 14px;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
      }
      button,
      a,
      input,
      select,
      textarea {
        touch-action: manipulation;
      }
      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }
      a {
        color: var(--purple);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 3px solid #b7a1f5;
        outline-offset: 3px;
      }
      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }
      h1 {
        letter-spacing: -0.04em;
        font-size: 32px;
        line-height: 1.35;
      }
      h2 {
        font-size: 22px;
        letter-spacing: -0.02em;
      }
      h3 {
        font-size: 16px;
      }
      p {
        line-height: 1.8;
      }
      .muted {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.8;
      }
      .eyebrow {
        font-size: 10px;
        font-weight: 750;
        letter-spacing: 2px;
        color: var(--purple);
        margin-bottom: 16px;
      }
      .btn {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        border-radius: 9px;
        padding: 10px 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        line-height: 1.4;
        font-weight: 600;
        white-space: nowrap;
      }
      .btn:hover {
        background: #f4f0ff;
        text-decoration: none;
        border-color: #d2c4f2;
      }
      .primary {
        background: var(--purple);
        color: #fff;
        border-color: var(--purple);
      }
      .primary:hover {
        background: #6341b8;
        border-color: #6341b8;
      }
      .mint {
        background: var(--mint);
        color: #275b46;
        border-color: #c6e8d8;
      }
      .danger {
        color: var(--red);
      }
      .ghost {
        background: transparent;
        border-color: transparent;
      }
      .small {
        font-size: 12px;
        padding: 7px 11px;
      }
      .link-btn {
        background: none;
        border: 0;
        color: var(--purple);
        font-weight: 600;
        padding: 6px 8px;
      }
      .row {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .between {
        justify-content: space-between;
      }
      .wrap {
        flex-wrap: wrap;
      }
      .spacer {
        flex: 1;
      }
      .badge {
        font-size: 10px;
        border-radius: 5px;
        padding: 5px 8px;
        display: inline-flex;
        align-items: center;
        background: #f0ecfa;
        color: #7c62ad;
        white-space: nowrap;
      }
      .badge.published,
      .badge.correct {
        color: #267858;
        background: #e5f4ed;
      }
      .badge.draft {
        color: #a47b32;
        background: #fbf2df;
      }
      .badge.archived,
      .badge.skipped {
        color: #858296;
        background: #efedf2;
      }
      .badge.incorrect {
        color: #bc5966;
        background: #fbeaec;
      }
      .brand {
        display: flex;
        gap: 10px;
        align-items: center;
        color: var(--ink);
        font-weight: 800;
        letter-spacing: -0.03em;
      }
      .brand:hover {
        text-decoration: none;
      }
      .brand-mark {
        display: grid;
        grid-template-columns: repeat(2, 11px);
        gap: 3px;
        transform: rotate(-7deg);
      }
      .brand-mark i {
        width: 11px;
        height: 11px;
        background: #7958d0;
        border-radius: 3px;
      }
      .brand-mark i:last-child {
        background: #a4dfc3;
      }
      .brand small {
        display: block;
        color: #9893ab;
        letter-spacing: 1.4px;
        font-size: 8px;
        font-weight: 500;
        margin-top: 4px;
      }
      .sidebar {
        width: 218px;
        background: #fff;
        border-right: 1px solid var(--line);
        position: fixed;
        inset: 0 auto 0 0;
        padding: 31px 22px;
        display: flex;
        flex-direction: column;
        z-index: 20;
      }
      .sidebar .brand {
        margin: 0 0 45px 5px;
        font-size: 16px;
      }
      .nav-label {
        font-size: 9px;
        color: #b0aabb;
        letter-spacing: 1.6px;
        margin: 0 12px 12px;
      }
      .side-nav {
        display: grid;
        gap: 7px;
      }
      .side-nav button {
        background: none;
        border: 0;
        text-align: left;
        padding: 12px;
        border-radius: 8px;
        color: #8d879c;
        display: flex;
        gap: 11px;
        align-items: center;
        font-size: 12px;
      }
      .side-nav button.active {
        color: var(--purple);
        background: #f0ebfc;
        font-weight: 700;
      }
      .nav-icon {
        font-size: 16px;
        width: 19px;
        text-align: center;
      }
      .sidebar-foot {
        margin-top: auto;
        padding: 20px 8px 0;
        border-top: 1px solid var(--line);
        font-size: 10px;
        color: #9a93a7;
        line-height: 1.8;
      }
      .sidebar-foot b {
        color: #4b7465;
      }
      .admin-main {
        margin-left: 218px;
        padding: 27px 42px 60px;
        max-width: 1700px;
      }
      .topline {
        height: 40px;
        border-bottom: 1px solid var(--line);
        font-size: 11px;
        color: #a09aad;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 32px;
      }
      .page-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 26px;
      }
      .page-head h1 {
        margin-bottom: 8px;
      }
      .page-head p {
        color: var(--muted);
        font-size: 12px;
        margin: 0;
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
        margin: 25px 0 27px;
        padding: 23px 0;
      }
      .metric {
        padding: 0 25px;
        border-right: 1px solid var(--line);
      }
      .metric:last-child {
        border: 0;
      }
      .metric span {
        font-size: 11px;
        color: #9a93a7;
      }
      .metric strong {
        display: block;
        font-size: 27px;
        margin: 10px 0 5px;
        letter-spacing: -1px;
      }
      .metric small {
        font-size: 10px;
        color: #aba4b8;
      }
      .toolbar {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-bottom: 17px;
        flex-wrap: wrap;
      }
      .search {
        max-width: 300px;
        min-width: 200px;
        flex: 1;
      }
      .control,
      input:not([type="checkbox"]):not([type="radio"]):not([type="file"]),
      select,
      textarea {
        border: 1px solid #e3dfec;
        background: #fff;
        border-radius: 8px;
        padding: 10px 12px;
        color: var(--ink);
        outline: none;
        max-width: 100%;
      }
      input:focus,
      select:focus,
      textarea:focus {
        border-color: #a991e6;
        box-shadow: 0 0 0 3px #eee8fc;
      }
      textarea {
        width: 100%;
        resize: vertical;
        line-height: 1.8;
        min-height: 105px;
      }
      textarea.code,
      pre.code {
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 12px;
        line-height: 1.85;
      }
      select {
        font-size: 12px;
      }
      .table-wrap {
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
      }
      .data-table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
        min-width: 800px;
      }
      .data-table th {
        font-size: 10px;
        font-weight: 500;
        color: #a49bad;
        background: #fcfbfe;
        padding: 14px 18px;
        border-bottom: 1px solid var(--line);
      }
      .data-table td {
        padding: 18px;
        border-bottom: 1px solid #efecf4;
        font-size: 12px;
        vertical-align: middle;
      }
      .data-table tr:last-child td {
        border-bottom: 0;
      }
      .data-table tbody tr:hover {
        background: #fdfcfe;
      }
      .data-table td.title-col {
        max-width: 370px;
        min-width: 240px;
      }
      .data-table strong {
        font-weight: 650;
        display: block;
        font-size: 13px;
        line-height: 1.6;
      }
      .data-table small {
        font-size: 9px;
        color: #a29aaf;
        display: block;
        margin-top: 5px;
        line-height: 1.7;
      }
      .title-link {
        border: 0;
        background: none;
        padding: 0;
        text-align: left;
        color: var(--ink);
      }
      .table-actions {
        display: flex;
        gap: 3px;
      }
      .table-actions button {
        font-size: 11px;
      }
      .table-note {
        display: flex;
        justify-content: space-between;
        color: #a49bad;
        font-size: 10px;
        margin: 15px 3px;
      }
      .panel {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 26px;
        margin-bottom: 22px;
      }
      .panel > h2 {
        font-size: 18px;
      }
      .blank {
        padding: 60px 30px;
        text-align: center;
        color: var(--muted);
        line-height: 2;
      }
      .loader {
        padding: 90px;
        text-align: center;
        color: var(--muted);
      }
      .error-box {
        padding: 15px 18px;
        background: #fff0f1;
        border: 1px solid #f1d5da;
        color: #ab5263;
        border-radius: 9px;
        line-height: 1.8;
      }
      .success-box {
        padding: 15px 18px;
        background: #eaf7f0;
        color: #39765c;
        border: 1px solid #cee8da;
        border-radius: 9px;
        line-height: 1.8;
      }
      .notice {
        background: #f0ecf9;
        border: 1px solid #e6def5;
        border-radius: 9px;
        padding: 14px 17px;
        font-size: 12px;
        color: #7f6b9c;
        line-height: 1.9;
      }
      .notice.mint-note {
        background: #edf7f2;
        border-color: #dceee4;
        color: #5b8470;
      }
      .field {
        display: grid;
        gap: 8px;
        margin-bottom: 18px;
        min-width: 0;
      }
      .field > label {
        font-size: 11px;
        font-weight: 650;
        color: #6c637d;
      }
      .field small {
        font-size: 10px;
        color: #a59bb3;
        line-height: 1.8;
      }
      .field input,
      .field select {
        width: 100%;
      }
      .field-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 20px;
      }
      .field.full {
        grid-column: 1/-1;
      }
      .required {
        color: #b1627c;
        margin-left: 3px;
      }
      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 25px 0 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--line);
        font-weight: 650;
        font-size: 13px;
      }
      .form-row {
        padding: 15px 16px;
        background: #faf9fd;
        border: 1px solid #eae5f2;
        border-radius: 8px;
        margin: 11px 0;
      }
      .form-row .field {
        margin-bottom: 12px;
      }
      .form-row .field:last-child {
        margin-bottom: 0;
      }
      .dialog {
        border: 0;
        padding: 0;
        border-radius: 16px;
        box-shadow: 0 25px 90px #33234f33;
        max-width: 700px;
        width: calc(100% - 40px);
        max-height: 90vh;
        color: var(--ink);
      }
      .dialog::backdrop {
        background: #28203766;
        backdrop-filter: blur(4px);
      }
      .dialog.wide {
        width: min(1160px, 95vw);
        max-width: 1160px;
      }
      .dialog-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 25px;
        border-bottom: 1px solid var(--line);
        background: #fff;
        position: sticky;
        top: 0;
        z-index: 3;
      }
      .dialog-head h2 {
        font-size: 17px;
        margin: 0;
      }
      .dialog-body {
        padding: 25px;
      }
      .close {
        background: #fff;
        border: 1px solid var(--line);
        width: 30px;
        height: 30px;
        border-radius: 8px;
        font-size: 17px;
        color: #8c819b;
      }
      .tabs {
        display: flex;
        gap: 3px;
        border-bottom: 1px solid var(--line);
        overflow: auto;
        flex-shrink: 0;
        background: #fff;
      }
      .tabs button {
        border: 0;
        border-bottom: 2px solid transparent;
        background: #fff;
        color: #a097b0;
        font-size: 12px;
        padding: 15px 18px;
        white-space: nowrap;
      }
      .tabs button.active {
        border-color: var(--purple);
        color: var(--purple);
        font-weight: 700;
      }
      .editor-layout {
        display: grid;
        grid-template-columns: 1fr 260px;
        min-height: 440px;
      }
      .editor-content {
        padding: 24px 28px;
        min-width: 0;
      }
      .editor-aside {
        padding: 25px 23px;
        background: #fbfafe;
        border-left: 1px solid var(--line);
        font-size: 11px;
        line-height: 1.9;
        color: #9b8fa9;
      }
      .editor-aside strong {
        color: #615471;
        display: block;
        margin-bottom: 10px;
      }
      .editor-footer {
        padding: 16px 25px;
        border-top: 1px solid var(--line);
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        bottom: 0;
        background: #fff;
        z-index: 3;
      }
      .editor-footer small {
        color: #a69bb5;
        font-size: 10px;
      }
      .templates {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 11px;
      }
      .template-btn {
        text-align: left;
        border: 1px solid var(--line);
        background: #fff;
        padding: 18px;
        border-radius: 10px;
      }
      .template-btn:hover {
        border-color: #a991e6;
        background: #faf7ff;
      }
      .template-btn strong {
        display: block;
        font-size: 13px;
        margin-bottom: 7px;
      }
      .template-btn small {
        color: #9f94ae;
        font-size: 11px;
        line-height: 1.8;
      }
      .steps {
        display: grid;
        gap: 0;
      }
      .step {
        display: grid;
        grid-template-columns: 35px 1fr;
        gap: 14px;
        padding: 20px 0;
        border-bottom: 1px solid var(--line);
      }
      .step:last-child {
        border: 0;
      }
      .step > b {
        width: 30px;
        height: 30px;
        background: #eee8fa;
        border-radius: 8px;
        display: grid;
        place-items: center;
        color: var(--purple);
        font-size: 12px;
      }
      .step h3 {
        font-size: 14px;
        margin: 3px 0 9px;
      }
      .step p {
        font-size: 12px;
        margin-bottom: 0;
        color: #90869f;
      }
      .guide-layout {
        display: grid;
        grid-template-columns: 1.2fr 1fr;
        gap: 23px;
      }
      .map-row {
        display: grid;
        grid-template-columns: 140px 1fr;
        gap: 15px;
        padding: 16px 0;
        border-bottom: 1px solid var(--line);
        line-height: 1.8;
        font-size: 12px;
      }
      .map-row:last-child {
        border: 0;
      }
      .map-row b {
        font-weight: 600;
      }
      .map-row span {
        color: #968ba5;
      }
      .code-box {
        background: #282339;
        color: #d5cbe9;
        border-radius: 10px;
        padding: 22px;
        overflow: auto;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 11px;
        line-height: 1.85;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 450px;
      }
      .api-line {
        display: flex;
        gap: 12px;
        align-items: center;
        border-bottom: 1px solid var(--line);
        padding: 14px 0;
        font-size: 12px;
      }
      .method {
        width: 40px;
        color: #379576;
        font-size: 10px;
        font-weight: 750;
      }
      .api-line code {
        color: #6c548b;
        font-size: 11px;
      }
      .api-line small {
        margin-left: auto;
        color: #a498af;
        font-size: 10px;
      }
      .version-item {
        padding: 16px 0;
        border-bottom: 1px solid var(--line);
      }
      .version-item h3 {
        font-size: 13px;
        margin-bottom: 7px;
      }
      .asset-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
      }
      .asset {
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
        background: #fff;
      }
      .asset img {
        width: 100%;
        height: 150px;
        object-fit: cover;
        background: #ece8f2;
      }
      .asset-info {
        padding: 15px;
      }
      .asset-info strong {
        font-size: 12px;
        display: block;
        word-break: break-all;
      }
      .asset-info small {
        display: block;
        font-size: 10px;
        color: #a599b1;
        margin: 7px 0;
      }
      .toast {
        position: fixed;
        z-index: 200;
        bottom: 28px;
        left: 50%;
        transform: translateX(-50%);
        background: #332a47;
        color: #fff;
        font-size: 12px;
        padding: 13px 21px;
        border-radius: 10px;
        box-shadow: 0 10px 35px #2a1c4033;
        max-width: 90vw;
      }
      .hidden {
        display: none !important;
      }
      .player-shell {
        max-width: 1060px;
        margin: 0 auto;
        padding: 0 25px;
      }
      .player-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 27px 0;
        border-bottom: 1px solid var(--line);
        gap: 18px;
      }
      .player-top .brand {
        font-size: 18px;
      }
      .hero {
        display: grid;
        grid-template-columns: 1.15fr 1fr;
        gap: 60px;
        align-items: center;
        padding: 76px 0 63px;
      }
      .hero h1 {
        font-size: 51px;
        line-height: 1.35;
        margin-bottom: 22px;
      }
      .hero em {
        font-style: normal;
        color: var(--purple);
      }
      .hero p {
        color: #978da6;
        font-size: 14px;
      }
      .hero-proof {
        background: #ebe5f8;
        border-radius: 25px;
        padding: 30px;
        transform: rotate(-3deg);
        box-shadow: 0 25px 50px #b9a8d427;
      }
      .hero-proof-inner {
        background: #fff;
        border-radius: 15px;
        padding: 24px;
        transform: rotate(3deg);
      }
      .hero-proof-inner b {
        font-size: 43px;
        display: block;
        color: var(--purple);
        margin: 18px 0 7px;
      }
      .hero-proof-inner p {
        font-size: 12px;
        margin: 0;
      }
      .mini-progress {
        display: flex;
        gap: 5px;
        margin-top: 22px;
      }
      .mini-progress i {
        height: 6px;
        background: #d5c9ed;
        flex: 1;
        border-radius: 4px;
      }
      .mini-progress i:nth-child(-n + 3) {
        background: #8ecdb0;
      }
      .catalogue {
        display: grid;
        grid-template-columns: 1fr 1fr;
        border-top: 1px solid var(--line);
        margin: 25px 0 50px;
      }
      .catalogue-item {
        display: flex;
        align-items: center;
        gap: 17px;
        padding: 24px 15px;
        border-bottom: 1px solid var(--line);
      }
      .catalogue-item:nth-child(odd) {
        border-right: 1px solid var(--line);
      }
      .catalogue-item .no {
        color: #aa9abd;
        font-size: 12px;
      }
      .catalogue-item h3 {
        font-size: 13px;
        margin: 0 0 7px;
      }
      .catalogue-item p {
        font-size: 10px;
        margin: 0;
        color: #a197ad;
      }
      .player-work {
        max-width: 920px;
        margin: 35px auto 60px;
      }
      .player-progress {
        display: flex;
        gap: 5px;
        margin: 18px 0 32px;
      }

              xml(text) +

          }

    <script>
      (function (root) {
        "use strict";
        const esc = (x) =>
          String(x ?? "").replace(
            /[&<>"']/g,
            (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
          );
        const btn = (label, action, extra = "") =>
          '<button type="button" class="btn small ' + extra + '" data-task="' + action + '">' + label + "</button>";
        const widget = (title, body, extra = "") =>
          '<section class="widget"><div class="widget-label"><b>' +
          esc(title) +
          "</b><span>" +
          extra +
          "</span></div>" +
          body +
          "</section>";
        function download(data, name, mime = "text/plain;charset=utf-8") {
          const a = document.createElement("a"),
            url = URL.createObjectURL(new Blob([data], { type: mime }));
          a.href = url;
          a.download = name;
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 30000);
        }
        const registry = {};
        function mount(el, q, options = {}) {
          const s = options.simState || {},
            m = q.materials || {},
            base = options.baseURL || "";
          let busy = false;
          el.innerHTML =
            '<div class="task-material"></div><form class="answer-form" novalidate><h3>填写你的结果</h3><div class="answer-fields">' +
            q.fields
              .map(
                (f) =>
                  '<div class="field"><label for="task-answer-' +
                  esc(f.key) +
                  '">' +
                  esc(f.label) +
                  '</label><input id="task-answer-' +
                  esc(f.key) +
                  '" name="' +
                  esc(f.key) +
                  '" data-answer="' +
                  esc(f.key) +
                  '" type="text" ' +
                  (f.kind === "number" ? 'inputmode="numeric"' : "") +
                  ' autocomplete="off" placeholder="' +
                  esc(f.placeholder || "填写你的结果") +
                  '" value="' +
                  esc(options.values?.[f.key] || "") +
                  '"><span class="field-error" data-error="' +
                  esc(f.key) +
                  '"></span></div>',
              )
              .join("") +
            '</div><div class="inline-feedback"></div><div class="answer-actions"><button class="btn ghost small" type="button" data-task="skip">跳过本题</button><button class="btn primary" type="submit">' +
            esc(options.submitLabel || "提交答案") +
            "</button></div></form>";
          const material = el.querySelector(".task-material"),
            form = el.querySelector("form"),
            feedback = el.querySelector(".inline-feedback");
          const notify = () => options.onChange?.(values(), s);
          const ctx = {
            q,
            m,
            s,
            base,
            esc,
            btn,
            widget,
            download,
            el: material,
            render: () => {
              const fn = registry[q.tools];
              material.innerHTML = fn ? fn(ctx) : '<div class="error-box">交互类型尚未注册</div>';
              notify();
            },
            notify,
          };
          function values() {
            return Object.fromEntries(
              Array.from(form.querySelectorAll("[data-answer]")).map((e) => [e.dataset.answer, e.value]),
            );
          }
          function showError(e) {
            feedback.innerHTML =
              '<div class="error-box" role="alert">' +
              esc(e.message || e) +
              (e.loginUrl ? '<br><a class="btn small" href="' + esc(e.loginUrl) + '">登录后继续</a>' : "") +

            if (e.details && typeof e.details === "object" && !Array.isArray(e.details)) {
              for (const key of Object.keys(e.details)) {
                const target = Array.from(form.querySelectorAll("[data-error]")).find((x) => x.dataset.error === key);
                if (target) target.textContent = e.details[key];
              }
              const first = form.querySelector("[data-error]:not(:empty)");

            }
          }
          async function submit(skip = false) {
            if (busy) return;
            feedback.innerHTML = "";
            form.querySelectorAll("[data-error]").forEach((e) => (e.textContent = ""));
            if (!skip) {
              const missing = q.fields.find((f) => !String(values()[f.key] || "").trim());

                showError({
                  message: "请完成作答，或选择跳过本题",
                  details: { [missing.key]: "请填写" + missing.label },

              }

            busy = true;
            const b = form.querySelector("button[type=submit]");

                  { correct: "回答正确", incorrect: "需要再练", skipped: "已跳过" }[r.status] +
                  "</div>";

            } finally {

              b.disabled = false;
              b.textContent = options.submitLabel || "提交答案";

          }
          el.addEventListener("input", (e) => {
            if (e.target.matches("[data-answer]")) {
              e.target.parentElement.querySelector(".field-error").textContent = "";
              notify();
            }
            if (e.target.dataset.materialInput) {
              const key = e.target.dataset.materialInput;
              s[key] = e.target.value;
              if (["fileSearch", "wikiSearch"].includes(key)) {
                const start = e.target.selectionStart;
                ctx.render();
                const next = material.querySelector('[data-material-input="' + key + '"]');
                next?.focus();
                try {
                  next?.setSelectionRange(start, start);
                } catch {}
              } else if (key === "docText") {
                const count = material.querySelector("[data-charcount]");
                if (count) count.textContent = LabFiles.chars(s.docText);

            }
          });
          el.addEventListener("change", (e) => {
            if (e.target.dataset.materialInput === "docFormat") {

          el.addEventListener("click", async (e) => {
            const b = e.target.closest("[data-task]");

        }
        const actions = {
          "reference-open": (c) => {
            c.s.referenceOpen = !c.s.referenceOpen;

          },
          "mail-start": (c) => {
            c.s.mailStart = true;
            c.render();
          },
          "mail-login": (c) => {

            c.s.password = p;
            c.s.mailError = p !== c.m.password ? "模拟密码不正确，请根据题目线索再试。" : "";
            if (!c.s.mailError) {
              c.s.logged = true;
              c.s.read = [];
              c.s.folder = "inbox";
            }
            c.render();
          },
          "mail-reset": (c) => {

          },

            c.s.folder = "inbox";
            c.render();
          },
          "mail-sent": (c) => {
            c.s.folder = "sent";
            c.s.message = null;
            c.render();
          },
          "mail-drafts": (c) => {
            c.s.folder = "drafts";
            c.s.message = null;
            c.render();
          },
          "mail-message": (c, b) => {
            c.s.message = Number(b.dataset.id);
            c.s.read ||= [];
            if (!c.s.read.includes(c.s.message)) c.s.read.push(c.s.message);
            c.render();
          },
          "files-start": (c) => {
            c.s.filesStart = true;
            c.s.location = "root";
            c.render();
          },
          "file-open": (c, b) => openNode(c, b.dataset.id),
          "file-up": (c) => {
            const n = c.m.nodes.find((x) => x.id === (c.s.location || "root"));
            c.s.location = n?.parent || "root";
            c.s.fileSearch = "";
            c.s.fileOpen = null;
            c.render();
          },
          "file-close": (c) => {
            c.s.fileOpen = null;
            c.render();
          },
          "file-help": (c) => {
            c.s.fileHelp = !c.s.fileHelp;
            c.render();
          },

            c.render();
          },

    </script>
    <script>
      (function (root) {
        "use strict";
        const kinds = {
          reference: "资料检索",
          apps: "图标辨识",
          mail: "邮箱仿真",
          files: "文件管理",
          document: "文档处理",
          source: "源码查找",
          wiki: "历史溯源",
          photo: "图片元数据",
        };
        const clean = (x) =>
          String(x ?? "")
            .normalize("NFKC")
            .trim();
        const count = (x) => Array.from(String(x).replace(/[\r\n]/g, "")).length;
        function normalize(value, rule = {}) {
          let s = clean(value);
          if (rule.kind === "number") return /^\d+$/.test(s) ? String(Number(s)) : s;
          if (rule.kind === "date") {
            s = s.replace(/[年月/.]/g, "-").replace(/日/g, "");
            let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
            if (m) return m[1] + "-" + m[2].padStart(2, "0") + "-" + m[3].padStart(2, "0");
            return s;
          }
          if (rule.kind === "time") {
            const m = s.replace(/：/g, ":").match(/^(\d{1,2}):(\d{1,2})(?::\d{1,2})?$/);
            return m ? m[1].padStart(2, "0") + ":" + m[2].padStart(2, "0") : s;
          }
          if (!rule.caseSensitive) s = s.toLowerCase();
          if (rule.ignoreSpaces !== false) s = s.replace(/\s/g, "");
          return s;
        }
        function validateAnswer(q, values) {
          const errors = {};
          for (const f of q.fields || []) {
            const v = clean(values?.[f.key]);
            if (!v) errors[f.key] = "请填写" + f.label;
            else if (f.kind === "number" && !/^\d+$/.test(v)) errors[f.key] = "请填写大于或等于0的整数";
            else if (f.kind === "date" && !/^\d{4}[-/.年]\d{1,2}[-/.月]\d{1,2}日?$/.test(v))
              errors[f.key] = "请填写年月日，例如2026/01/15";
            else if (f.kind === "time" && !/^\d{1,2}[:：]\d{1,2}(?::\d{1,2})?$/.test(v))
              errors[f.key] = "请按时:分填写，例如09:30";
            if (v.length > 300) errors[f.key] = "答案不能超过300个字符";
          }
          return errors;
        }
        function grade(q, values, skip = false) {
          if (skip) return { status: "skipped", fields: {}, score: 0 };
          const fields = {};

                ? '<span class="player-login-label">' +
                  E(sessionUser.name) +
                  '</span><button class="btn small ghost" data-player="history">我的记录</button>' +
                  (sessionUser.role === "admin" ? '<a class="btn small" href="/bank">题库管理</a>' : "") +
                  '<a class="btn small ghost" href="/signout-with-chatgpt?return_to=%2F" target="_top">退出</a>'
                : '<a class="btn small" href="/login?next=%2Fexperience">登录答题端 →</a>') +
            '<a class="btn mveri-header-return" href="index.html">← 返回公共服务官网</a></nav></header>'
          );
        }
        function footer() {
          return "";
        }
        function home() {
          const active = run && !run.finishedAt;
          return (
            (active
              ? '<div class="notice mint-note row between wrap" style="margin-top:25px"><span>上次体验已完成 ' +
                run.answers.filter(Boolean).length +
                "/" +
                run.questions.length +
                ' 题，草稿已保留。</span><button class="btn small mint" data-player="resume">继续上次体验 →</button></div>'
              : "") +
            '<section class="hero"><div><div class="eyebrow">REAL TASKS · REAL PRACTICE</div><h1>动手完成，<br><em>' +
            list.length +
            '项数字挑战。</em></h1><p>查资料、用工具、找线索。<br>按自己的节奏完成任务，发现值得继续练习的能力。</p><div class="row wrap" style="margin-top:28px"><button class="btn primary" data-player="' +
            (active ? "resume" : "start") +
            '">' +
            (active ? "继续上次体验" : "开始任务体验") +
            " →</button>" +
            (run?.finishedAt
              ? '<button class="btn ghost" data-player="results">查看上次结果</button>'
              : '<button class="btn ghost" data-player="help">先了解怎么玩</button>') +
            '</div><div class="muted" style="margin-top:20px">随时保留进度 · 完成后逐题复盘 · ' +
            (window.OFFLINE_BANK ? "无需联网" : demo ? "原8道教学示例" : "内容由题库实时发布") +
            '</div></div><div class="hero-proof"><div class="hero-proof-inner"><div class="row between"><span class="badge">能力工作空间</span><span class="counter">READY</span></div><b>' +
            list.length +
            '<span style="font-size:16px;font-weight:500;margin-left:8px;color:#b19bc7">TASKS</span></b><h3 style="margin-top:17px">你的工具，已经就绪。</h3><p>信息检索 · 仿真操作 · 文件处理<br>每一次提交，都留下你的学习线索。</p><div class="mini-progress">' +
            Array.from({ length: 8 }, () => "<i></i>").join("") +
            '</div></div></div></section><div class="row between"><h2 style="font-size:20px;margin:0">这次，你会用到这些能力</h2><span class="muted">' +
            list.length +
            '项已发布任务</span></div><div class="catalogue">' +
            list
              .map(
                (q, i) =>
                  '<div class="catalogue-item"><span class="no">' +
                  String(i + 1).padStart(2, "0") +
                  "</span><div><h3>" +
                  E(q.title) +
                  "</h3><p>" +
                  E(q.area) +
                  " · " +
                  E(q.tag) +
                  " · v" +
                  q.version +
                  "</p></div></div>",
              )
              .join("") +
            "</div>" +
            (!window.OFFLINE_BANK && !demo && sessionUser?.role === "admin"
              ? '<div class="row wrap" style="margin-bottom:35px"><a class="btn small" href="/api/admin/offline">下载当前离线体验包 ↓</a><span class="muted">训练包在本机判分；在线版本使用服务端判分。</span></div>'
              : "") +
            footer()
          );
        }
        function render() {
          if (preview) {
            renderPreview();
            return;
          }
          document.title =
            screen === "question"
              ? "第" + (run.index + 1) + "/" + run.questions.length + "题 · 现代职业教育研究院公共服务平台"
              : screen === "results"
                ? "体验结果 · 现代职业教育研究院公共服务平台"
                : "现代职业教育研究院公共服务平台 · 数字任务体验";
          root.innerHTML =
            '<div class="player-shell">' +
            header() +
            (screen === "home"
              ? home()
              : screen === "results"
                ? results()
                : '<main class="player-work" id="work"></main>') +
            "</div>";
          if (screen === "question") renderQuestion();
        }
        async function start() {
          if (!list.length) {
            toast("当前还没有已发布的题目。");
            return;
          }
          toast("正在准备任务材料…");
          const questions = await Promise.all(list.map((q) => bank.getQuestion(q.id, q.version)));
          run = {
            id: Date.now().toString(36),
            startedAt: new Date().toISOString(),
            finishedAt: null,
            index: 0,
            questions,
            answers: Array(questions.length).fill(null),
            drafts: {},
            sims: {},
          };
          screen = "question";
          persist();
          render();
          window.scrollTo(0, 0);
        }
        function renderQuestion() {
          const index = run.answers.findIndex((a) => !a);
          if (index < 0) {
            run.finishedAt ||= new Date().toISOString();
            screen = "results";
            persist();
            render();
            return;
          }
          run.index = index;
          const q = run.questions[index],
            work = document.getElementById("work");
          work.innerHTML =
            '<div class="row between"><span class="muted">' +
            run.questions.length +
            '项真实任务体验</span><span class="badge">自由模式 · v' +
            q.version +
            '</span></div><div class="player-progress" aria-label="第' +
            (index + 1) +
            "题，共" +
            run.questions.length +
            '题">' +
            run.questions
              .map((_, i) => '<i class="' + (run.answers[i] ? "done" : i === index ? "current" : "") + '"></i>')
              .join("") +
            '</div><div class="eyebrow">' +
            E(q.area) +
            " / " +
            E(q.tag) +
            '</div><h1 class="question-title">' +
            String(index + 1).padStart(2, "0") +
            " · " +
            E(q.title) +
            '</h1><h2 class="question-task">' +
            E(q.prompt) +
            '</h2><p class="question-detail">' +
            E(q.detail) +
            '</p><div id="question-task"></div>' +
            footer();
          const sim = run.sims[q.id] || (run.sims[q.id] = {});
          QuestionRenderers.mount(document.getElementById("question-task"), q, {
            values: run.drafts[q.id] || {},
            simState: sim,
            submitLabel: index === run.questions.length - 1 ? "提交并查看结果" : "提交并继续",
            onChange: (v, s) => {
              run.drafts[q.id] = v;
              run.sims[q.id] = s;
              persist();
            },
            onSubmit: async (v, skip) => {
              const result = await bank.submit(q.id, v, q.version, skip);
              run.answers[index] = result;
              persist();
              if (run.answers.every(Boolean)) {
                run.finishedAt = new Date().toISOString();
                screen = "results";
              }
              render();
              window.scrollTo(0, 0);
              return result;
            },
          });
        }
        function results() {
          if (!run?.finishedAt) {
            screen = "home";
            return home();
          }
          const count = run.answers.filter((a) => a?.status === "correct").length,
            wrong = run.answers.filter((a) => a?.status === "incorrect").length,
            skipped = run.answers.length - count - wrong;
          return (
            '<main class="player-work"><div class="result-hero"><div><div class="eyebrow">EXPERIENCE COMPLETED</div><h1>这次体验已完成</h1><p class="muted">' +
            count +
            "题正确 · " +
            wrong +
            "题需要再练 · " +
            skipped +
            '题跳过<br>打开逐题解析，把体验变成下一步的练习。</p></div><div class="result-score"><span><b>' +
            count +
            "</b>/ " +
            run.questions.length +
            '</span></div></div><div class="table-wrap">' +
            run.questions
              .map(
                (q, i) =>
                  '<div class="result-line"><span>' +
                  String(i + 1).padStart(2, "0") +
                  "</span><div><h3>" +
                  E(q.title) +
                  ' <span class="badge ' +
                  run.answers[i].status +
                  '">' +
                  { correct: "回答正确", incorrect: "需要再练", skipped: "已跳过" }[run.answers[i].status] +
                  "</span></h3><p>" +
                  E(q.area) +
                  " · 版本v" +
                  q.version +
                  '</p></div><button class="btn small ghost" data-player="review" data-id="' +
                  i +
                  '">答案与解析 →</button></div>',
              )
              .join("") +
            '</div><div class="row wrap" style="margin:24px 0"><button class="btn primary" data-player="retry">重新体验</button><button class="btn" data-player="export">导出体验记录 ↓</button><button class="btn ghost" data-player="home">返回首页</button></div><div class="notice mint-note">本次为数字任务体验，不生成能力认证等级。建议优先复盘错误与跳过的题目，再独立操作一次。</div><div style="margin-top:40px">' +
            footer() +
            "</div></main>"
          );
        }
        function review(index) {
          const q = run.questions[index],
            a = run.answers[index];
          dialog(
            "第" + (index + 1) + "题 · 学习解析",
            "<h3>" +
              E(q.prompt) +
              "</h3>" +
              q.fields
                .map(
                  (f) =>
                    '<div class="review-row"><div><small>' +
                    E(f.label) +
                    " / 你的结果</small>" +
                    E(a.values?.[f.key] || "未回答") +
                    "</div><div><small>参考结果</small>" +
                    E(a.reference?.[f.key] ?? "旧版记录未保存参考答案") +
                    "</div></div>",
                )
                .join("") +
              (a.hint && a.status !== "correct" ? '<div class="notice">' + E(a.hint) + "</div>" : "") +
              '<h3 style="margin-top:25px">可以这样完成</h3><ol class="review-steps">' +
              (a.lesson || ["这是一条原始演示记录。重新体验可以获得新版解析。"])
                .map((x) => "<li>" + E(x) + "</li>")
                .join("") +
              '</ol><p class="muted">本题作答依据版本v' +
              q.version +
              "判定，之后发布新版本不会改变这次结果。</p>",
          );
        }
        async function renderPreview() {
          if (!previewQ) {
            root.innerHTML = '<div class="loader">正在加载命题预览…</div>';
            return;
          }
          const q = previewQ;
          root.innerHTML =
            '<div class="player-shell">' +
            header() +
            '<main class="player-work"><div class="notice mint-note">命题预览 · 当前草稿修订 r' +
            q.revision +
            ' · 提交用于回测，不计入正式作答统计。</div><div class="eyebrow" style="margin-top:30px">' +
            E(q.area) +
            " / " +
            E(q.tag) +
            '</div><h1 class="question-title">' +
            E(q.title) +
            '</h1><h2 class="question-task">' +
            E(q.prompt) +
            '</h2><p class="question-detail">' +
            E(q.detail) +
            '</p><div id="preview-task"></div><div id="preview-response"></div></main></div>';
          QuestionRenderers.mount(document.getElementById("preview-task"), q, {
            submitLabel: "回测答案",
            showFeedback: true,
            onSubmit: async (v, skip) => {
              const result = await bank.request("/api/admin/preview", {
                method: "POST",
                body: JSON.stringify({ question: q, values: v, skip }),
              });
              document.getElementById("preview-response").innerHTML =
                '<pre class="code-box">' + E(JSON.stringify(result, null, 2)) + "</pre>";
              return result;
            },
          });
        }
        document.addEventListener("click", async (e) => {
          const b = e.target.closest("[data-player]");
          if (!b) return;
          try {
            const act = b.dataset.player;
            if (act === "start") {
              b.disabled = true;
              await start();
            } else if (act === "resume") {
              screen = "question";
              render();
              window.scrollTo(0, 0);
            } else if (act === "home") {
              screen = "home";
              render();
              window.scrollTo(0, 0);
            } else if (act === "results") {
              screen = "results";
              render();
            } else if (act === "history") {
              const r = await bank.request("/api/my/attempts");
              dialog(
                "我的作答记录",
                r.items.length
                  ? r.items
                      .map(
                        (x) =>
                          '<div class="version-item"><div class="row between"><b style="font-size:12px">' +
                          E(x.title) +
                          " · v" +
                          x.question_version +
                          '</b><span class="badge ' +
                          x.status +
                          '">' +
                          { correct: "正确", incorrect: "需要再练", skipped: "跳过" }[x.status] +
                          '</span></div><p class="muted" style="margin:8px 0 0">' +
                          new Date(x.created_at).toLocaleString("zh-CN") +
                          "</p></div>",
                      )
                      .join("")
                  : '<p class="muted">当前账号还没有正式作答记录。官网示例体验不计入这里。</p>',
              );
            } else if (act === "close") modal.close();
            else if (act === "review") review(Number(b.dataset.id));
            else if (act === "retry") {
              if (confirm("开始新一轮体验？当前结果可先导出保存。")) {
                b.disabled = true;
                await start();
              }
            } else if (act === "export")
              QuestionRenderers.download(
                JSON.stringify(
                  {
                    title: "现代职业教育研究院公共服务平台任务体验记录",
                    startedAt: run.startedAt,
                    finishedAt: run.finishedAt,
                    results: run.questions.map((q, i) => ({
                      id: q.id,
                      title: q.title,
                      version: q.version,
                      ...run.answers[i],
                    })),
                  },
                  null,
                  2,
                ),
                "现代职业教育研究院公共服务平台_体验记录.json",
                "application/json;charset=utf-8",
              );
            else if (act === "help")
              dialog(
                "这套操作题，怎么玩？",
                '<div class="steps">' +
                  [
                    [
                      "先做任务，再填写结果",
                      "有的题查资料，有的题操作模拟应用，或下载文件后处理。线索就在题目提供的材料里。",
                    ],
                    [
                      "提交或跳过，按自己的节奏完成",
                      "没有倒计时。提交后进入下一题，完成全部任务后统一查看结果与逐题解析。",
                    ],
                    ["刷新后可以继续", "本机保存当前题的草稿和操作状态；正式作答按题目版本提交。"],
                    ["文件夹怎么打开", "单击文件名称或右侧“打开”即可进入；电脑端也支持双击。可以搜索文件名。"],
                  ]
                    .map(
                      ([a, c], i) =>
                        '<div class="step"><b>' +
                        String(i + 1).padStart(2, "0") +
                        "</b><div><h3>" +
                        a +
                        "</h3><p>" +
                        c +
                        "</p></div></div>",
                    )
                    .join("") +
                  "</div>",
              );
          } catch (err) {
            toast(err.message);
          } finally {
            if (b.isConnected) b.disabled = false;
          }
        });
        async function init() {
          if (window.OFFLINE_BANK) {
            key = "digital-eight-offline-" + window.OFFLINE_BANK.release;
          } else {
            let session;
            try {
              session = await bank.request("/api/session");
            } catch (err) {
              if (!demo) throw err;
              session = { loggedIn: false };
            }
            sessionUser = session.user || null;
            if (!demo && !sessionUser) {
              location.assign("/login?next=" + encodeURIComponent(preview ? "/bank" : "/experience"));
              return;
            }
            key = demo ? "digital-eight-public-demo-v3" : "digital-eight-user-" + sessionUser.userId;
            if (!demo && sessionUser?.role === "admin" && !localStorage.getItem("digital-eight-migrated-owner")) {
              const old = localStorage.getItem("digital-eight-bank-player-v2");
              if (old && !localStorage.getItem(key)) localStorage.setItem(key, old);
              localStorage.setItem("digital-eight-migrated-owner", sessionUser.userId);
            }
          }
          restoreRun();
          if (preview) {
            const id = params.get("id");
            if (!id) throw new Error("预览缺少题目ID");
            previewQ = await bank.request("/api/admin/questions/" + encodeURIComponent(id));
            render();
            return;
          }
          list = (await bank.list()).items;
          if (run && !run.finishedAt) screen = "question";
          else if (location.pathname === "/experience") screen = "home";
          render();
          if (demo && params.get("start") === "1" && (!run || run.finishedAt)) await start();
        }
        init().catch((err) => {
          root.innerHTML =
            '<div class="player-shell">' +
            header() +
            '<div class="error-box" style="margin-top:40px"><h2>任务暂时无法加载</h2><p>' +
            E(err.message) +
            '</p><button class="btn" onclick="location.reload()">重新加载</button>' +
            (err.loginUrl ? '<a class="btn primary" href="' + E(err.loginUrl) + '">登录后继续</a>' : "") +
            "</div></div>";
        });
      })();
    </script>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>个人能力发展报告 · MVERI</title>
    <style>
      :root {
        font-family: Inter, "PingFang SC", "Microsoft Yahei", sans-serif;
        color: #17365d;
        background: #eef3ff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      .toolbar {
        background: #173b80;
        color: #fff;
        padding: 12px max(20px, calc((100vw - 950px) / 2));
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .toolbar button {
        background: white;
        border: 0;
        border-radius: 8px;
        color: #173b80;
        font-weight: 700;
        padding: 10px 16px;
        cursor: pointer;
      }
      .paper {
        background: #fff;
        max-width: 950px;
        margin: 24px auto;
        padding: 45px 52px;
        box-shadow: 0 15px 50px #153b8620;
      }
      header {
        display: flex;
        align-items: center;
        gap: 15px;
        padding-bottom: 20px;
        border-bottom: 3px solid #315cc5;
      }
      header img {
        width: 61px;
        height: 61px;
        object-fit: contain;
      }
      header h1 {
        font-size: 25px;
        margin: 0;
      }
      header p {
        font-size: 11px;
        color: #697f9b;
        margin: 6px 0;
      }
      .meta {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin: 20px 0 28px;
      }
      .meta div,
      .stat {
        padding: 15px;
        background: #f5f8ff;
        border-radius: 10px;
      }
      .meta small,
      .stat small {
        display: block;
        color: #7a8eaa;
        font-size: 11px;
        margin-bottom: 7px;
      }
      .meta b,
      .stat b {
        font-size: 15px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }
      .stat b {
        font-size: 25px;
        color: #315cc5;
      }
      h2 {
        font-size: 17px;
        margin: 34px 0 12px;
        border-left: 4px solid #315cc5;
        padding-left: 12px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      th,
      td {
        border-bottom: 1px solid #e5edf9;
        padding: 11px;
        text-align: left;
        vertical-align: top;
      }
      th {
        background: #f5f8ff;
      }
      p,
      li {
        font-size: 12px;
        line-height: 1.9;
      }
      .notice {
        padding: 14px;
        background: #fff9eb;
        border: 1px solid #f1dbb2;
        border-radius: 8px;
        color: #815b21;
      }
      .foot {
        border-top: 1px solid #e2eaf8;
        padding-top: 18px;
        margin-top: 40px;
        color: #8191a6;
        font-size: 11px;
      }
      .empty {
        padding: 40px;
        text-align: center;
        color: #8a1e32;
      }
      .bar {
        height: 8px;
        background: #e6edfa;
        border-radius: 10px;
      }
      .bar i {
        display: block;
        height: 100%;
        border-radius: 10px;
        background: #315cc5;
      }
      @media (max-width: 700px) {
        .paper {
          margin: 0;
          padding: 22px;
        }
        .stats,
        .meta {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media print {
        @page {
          size: A4;
          margin: 16mm;
        }
        .toolbar {
          display: none;
        }
        .paper {
          box-shadow: none;
          margin: 0;
          max-width: none;
          padding: 0;
        }
        h2 {
          break-after: avoid;
        }
        tr {
          break-inside: avoid;
        }
        .stats,
        .meta {
          break-inside: avoid;
        }
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <b>现代职业教育研究院 · 个人能力发展报告</b>
      <div>
        <button onclick="history.back()">返回</button> <button onclick="window.print()">打印 / 保存 PDF</button>
      </div>
    </div>
    <main class="paper" id="paper"><p class="empty">正在读取当前账户档案……</p></main>
    <script src="../assets/data.js"></script>
    <script>
      (function () {
        "use strict";
        const e = (x) =>
          String(x ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
        const paper = document.getElementById("paper");
        let session = null,
          db = null;
        try {
          session = JSON.parse(sessionStorage.getItem("mveri_offline_session_v3"));
          db = JSON.parse(localStorage.getItem("mveri_demo_20261031_v1")) || window.MVERI_SEED;
        } catch {}
        if (!session || session.role !== "personal") {
          paper.innerHTML = '<div class="empty">当前没有有效的个人登录会话，请先返回公共服务平台登录。</div>';
          return;
        }
        db = db || window.MVERI_SEED;
        const user = db.people.find((x) => x.account === session.account);
        if (!user) {
          paper.innerHTML = '<div class="empty">无法定位当前账号的个人档案。</div>';
          return;
        }
        const org = db.orgs.find((x) => x.id === user.org);
        const en = db.enrollments.filter((x) => x.person === user.id);
        const ass = db.assessments
          .filter((x) => x.person === user.id)
          .sort((a, b) => (b.date || "").localeCompare(a.date || ""));
        const ex = db.exams.filter((x) => x.person === user.id);
        const apps = db.applications.filter((x) => x.person === user.id);
        const cert = db.certificates.filter((x) => x.person === user.id);
        const mean = en.length ? Math.round(en.reduce((n, x) => n + Number(x.progress || 0), 0) / en.length) : 0;
        const fw = (id) => db.frameworks.find((x) => x.id === id)?.name || id;
        const proj = (id) => db.projects.find((x) => x.id === id)?.name || id;
        const rows = (arr, fn, empty = "暂无记录") =>
          arr.length ? arr.map(fn).join("") : `<tr><td colspan="5">${empty}</td></tr>`;
        const advice = [];
        if (!ass.length) advice.push("完成首次测评，建立可追溯的能力表现基线。");
        if (en.some((x) => Number(x.progress) < 100)) advice.push("优先完成尚未结业的培训项目，并保存课程任务证据。");
        if (en.some((x) => x.completed) && !ex.length) advice.push("补齐已完成培训对应的结业考试证据。");
        if (ass.length) advice.push("建议针对最近一次测评的薄弱考评点开展专项训练，复测时优先比较相同标准版本的成绩。");
        if (!advice.length) advice.push("持续更新学习与测评记录，完善个人发展档案。");
        paper.innerHTML = `<header><img src="../assets/mveri-logo.png" alt="研究院徽标"><div><h1>个人能力发展报告</h1><p>现代职业教育研究院公共服务平台 · MVERI</p></div></header><div class="meta"><div><small>姓名 / 档案编号</small><b>${e(user.name)} · ${e(user.id)}</b></div><div><small>所属机构</small><b>${e(org?.name || "—")}</b></div><div><small>生成日期</small><b>${new Date().toLocaleDateString("zh-CN")}</b></div></div><div class="stats"><div class="stat"><small>测评次数</small><b>${ass.length}</b></div><div class="stat"><small>学习完成度</small><b>${mean}%</b></div><div class="stat"><small>考试记录</small><b>${ex.length}</b></div><div class="stat"><small>有效证书</small><b>${cert.filter((x) => x.status === "有效").length}</b></div></div><h2>一、测评记录与成绩变化</h2><table><thead><tr><th>记录编号</th><th>能力标准</th><th>日期</th><th>成绩</th><th>状态</th></tr></thead><tbody>${rows(ass, (x) => `<tr><td>${e(x.id)}</td><td>${e(fw(x.framework))}</td><td>${e(x.date)}</td><td>${e(x.score)} / 100</td><td>${e(x.status)}</td></tr>`)}</tbody></table><h2>二、培训学习记录</h2><table><thead><tr><th>报名编号</th><th>项目名称</th><th>进度</th><th>完成状态</th><th>关联标准</th></tr></thead><tbody>${rows(en, (x) => `<tr><td>${e(x.id)}</td><td>${e(proj(x.project))}</td><td>${e(x.progress)}%</td><td>${x.completed ? "已完成" : "学习中"}</td><td>${e(fw(db.projects.find((p) => p.id === x.project)?.framework))}</td></tr>`)}</tbody></table><h2>三、结业考试与认证成果</h2><table><thead><tr><th>记录类型</th><th>记录编号</th><th>关联项目</th><th>日期</th><th>状态 / 成绩</th></tr></thead><tbody>${rows([...ex.map((x) => ({ ...x, kind: "考试" })), ...apps.map((x) => ({ ...x, kind: "认证" })), ...cert.map((x) => ({ ...x, kind: "证书" }))], (x) => `<tr><td>${x.kind}</td><td>${e(x.id)}</td><td>${e(proj(x.project))}</td><td>${e(x.date || x.issued)}</td><td>${e(x.kind === "考试" ? x.score + "分" : x.status)}</td></tr>`)}</tbody></table><h2>四、个性化发展建议</h2><ol>${advice.map((x) => `<li>${e(x)}</li>`).join("")}</ol><h2>五、能力画像与证据说明</h2><p>本报告展示测评总分、培训、考试与认证的实际业务记录。现有题库未保存逐维度得分，因此<strong>不输出正式分维度能力判定</strong>。工作台雷达图为示例权重推导，供交互体验使用，不作为本报告的正式结论。</p><div class="notice">重要：本报告来自离线体验数据，不能作为职业资格、能力认证或真实培训完成情况证明。相关信息应以正式平台经审核的数据及证书为准。</div><div class="foot">现代职业教育研究院 · 个人能力发展档案 · 数据仅取自当前登录账号</div>`;
      })();
    </script>
  </body>
</html>
